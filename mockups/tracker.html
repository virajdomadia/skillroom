a refunded student's next refresh fails and the download is removed"}, {"id": "U2", "part": "Install + sync + v4 close", "version": "v4 Offline lessons", "milestone": "Milestone 4.0 · Offline", "est": "1 h", "done": "Progress made offline shows on the laptop after reconnecting; reviewer installs from the player in one tap; v4 tagged; case study live"}], "docs": [{"name": "PRD", "path": "PRD.md", "md": "# PRD — Skillroom: Online course platform\n\n**Status:** v1 · lifecycle steps 1–7 complete (2026-09-17) — see [docs/](docs/) · next: step 8 Project Setup (= milestone 1.0), **after Offcut** (build order 1 → 2 → 4 → 5 → 3 → 6)\n**Name:** Skillroom · *learn from people who do it*\n**URL:** https://skillroom.virajdomadia.com (landing live at https://skillroom-viraj.vercel.app until DNS)\n**Slot:** #5 · Budget ~38 h (v1 16 · v2 11 · v3 8 · v4 3) · Build fourth\n**Live artifacts:** [Tracker](https://claude.ai/artifact/AxgaJ1fZ6HELpWTZuBUXz6) (plan rows with status, all docs, mockups, project facts) · [Screens](https://claude.ai/artifact/U7Uy3zAL3dnPWmffQnk6fB) (every v1 screen, direction C · Notebook) · [Direction variants](https://claude.ai/artifact/JK9cTzwVjD4GrEqV36WPXi) (A–F, C chosen) · Landing: https://skillroom-viraj.vercel.app\n\n## One-liner\nA complete course platform with three sides — **students** who buy or subscribe, watch with resume-across-devices, pass quizzes and earn a certificate; **creators** (fictional Bengaluru coaches) who upload video and get paid; a **platform admin** who approves creators and pays out — where the video is ours end to end: **upload → an ffmpeg worker → encrypted adaptive HLS → a key server that only answers for enrolled students**. No Mux, no Stream, ₹0 per play.\n\n## Who it's for\n- **Student:** learns on a phone or laptop; buys a course (v1) or subscribes to all-access (v2); expects to resume exactly where they stopped on any device.\n- **Creator:** a coach or teacher who applies, gets approved, builds courses in a studio, uploads video, sees earnings and requests payouts.\n- **Admin (platform):** one operator — approves creators, takes courses down, retries failed video jobs, marks payouts paid, watches revenue. A small real UI, not code.\n\n## Why this project\n- **Video is the hard part most portfolios outsource.** Here the pipeline is owned: an ffmpeg worker that runs on free compute, an HLS ladder with AES-128 segments, and a key endpoint that is the authorization boundary — the same design Mux sells, explained in the README instead of pointed at.\n- **Three roles with real permission boundaries** (student / creator / admin) — the RBAC interview topic, made visible with three demo logins.\n- **Money in three shapes:** one-off purchase (v1), recurring subscription with a webhook-driven state machine (v2), and a creator ledger that splits the subscription pool by minutes watched (v3).\n- **The unique feature (v4, ₹0 per use): Offline lessons.** The site installs as a PWA; a lesson downloads as encrypted segments and plays offline under a 48-hour key lease — the course rides the Namma Metro, and \"non-enrolled can never play\" still holds.\n\n## Locked decisions (2026-09-17) — follow these until the project ends\n\n### 1. Identity: one platform, three roles, fictional creators\nSkillroom is the platform. Roles on one `users` table: `student` (default), `creator` (after an approved application), `admin` (seeded). Creators are fictional Bengaluru people (Koramangala, Jayanagar, Malleshwaram…) with CC portraits; courses are craft and skill subjects that Wikimedia Commons has real CC video for. Prices in ₹, integer paise in the DB. Three demo logins on the landing: **student** (one course 60 % done, one completed with a certificate), **creator** (two published courses, real earnings), **admin**.\n\n### 2. Video: our pipeline, our key server (the hard part)\n- **Upload:** the creator's browser uploads the source straight to **Vercel Blob** with a client token minted by the API (≤ 500 MB, mp4 / mov / webm) → `POST /creator/lessons/{id}/video` records the source and enqueues a `video_jobs` row.\n- **Worker:** `api/app/worker/transcode.py` — one Python script: claim the job → download the source → **ffmpeg** → HLS ladder **240p / 480p / 720p** (H.264 `veryfast`, 6-s segments, ~200 / 500 / 1000 kbps, AAC 48 k) with **AES-128-encrypted segments** under a per-lesson 16-byte key → poster + thumbnail sprite → upload to Blob under a random per-lesson prefix → report the manifest (renditions, segment durations, duration) to the API. **In production it runs on a GitHub Actions runner** (ffmpeg preinstalled, 4 vCPU, free minutes) fired by `repository_dispatch` from the API; locally it is `python -m app.worker.transcode --job <id>`. State machine `queued → processing → ready | failed`, attempts counted, admin retry. ~2 min from upload to playable.\n- **Serving:** segments, posters and sprites are public Blob URLs (unguessable, and the segments are ciphertext). The API serves the small parts: `GET /stream/{lesson}/master.m3u8?t=` and rendition playlists (generated from the manifest, segment URLs absolute to Blob) and **`GET /stream/{lesson}/key?t=`** — the 16 bytes, only for a valid token *and* a live `can_watch()` check. The token (`POST /lessons/{id}/play`) is HMAC-signed, bound to user + lesson, expires in 1 h. Player = **hls.js**; Safari uses native HLS (the token travels in the query string so Safari's own loader can fetch the key).\n- **The proof:** a non-enrolled user can hold every segment URL and still has nothing playable; a leaked token dies within the hour and opens one lesson; a refund revokes at the next key request. v3 adds a device limit at the same endpoint.\n- **What stays ₹0:** Blob's Hobby quota (≈ 1 GB storage, 10 GB transfer / month — verified in the row that first writes to it) holds the seed at ≤ 700 MB; the worker runs on Actions' free minutes; ffmpeg is open source; nothing metered sits on the play path. No DRM, no multi-region CDN — the honest size of an Indian course platform at this stage.\n\n### 3. Money: buy in v1, subscribe in v2, split the pool in v3\n- **v1 — buy a course:** Razorpay Standard Checkout, the Offcut recipe: order `pending_payment` → verify (HMAC) or webhook `payment.captured` → the same idempotent `mark_paid()` → `enrollments` row + **ledger entries** (`sale` +80 % to the creator, `fee` +20 % to the platform) in one transaction. Free courses (price 0) enroll instantly.\n- **v2 — All-access ₹499 / month:** Razorpay Subscriptions (plan created once by script; `subscription.activated / charged / halted / cancelled / completed` webhooks, event ids deduped) → `subscriptions` state machine with a 3-day grace on `halted` and cancel-at-period-end. Entitlement never changes shape: `can_watch(user, lesson) = lesson.is_preview or enrolled(course) or active_subscription(user)`.\n- **Payouts — a ledger, not Route:** `ledger_entries` is the source of truth (sale, fee, refund, payout, pool_share; signed paise). Creators see available / pending / paid and request a payout (v2); admin marks it paid with a bank reference. Razorpay Route (linked accounts, KYC) is an add-on behind a `PayoutProvider` protocol, not a version.\n- **v3 — the pool:** monthly close: subscription revenue captured in the month × 80 % = the pool; each creator's share = pool × their subscriber-minutes ÷ all subscriber-minutes (from the player's own heartbeats) → `pool_share` entries with the math visible on the creator's earnings page.\n\n### 4. Seed: 6 creators · 6 courses · 24 lessons · ≤ 700 MB\n| Course (topic follows what Commons has good CC video of) | Creator (fictional) | Price |\n|---|---|---|\n| Wheel pottery: first six pots | Meera Kulkarni · Jayanagar | ₹1,499 |\n| Flatbreads at home: paratha to naan | Arjun Nair · Koramangala | ₹999 |\n| Watercolour landscapes | Priya Raghavan · Malleshwaram | ₹1,299 |\n| Morning yoga, four weeks | Rohan Shetty · Indiranagar | **Free** |\n| Street photography on a phone | Divya Menon · HSR Layout | ₹1,199 |\n| Fingerstyle guitar from zero | Karthik Rao · Basavanagudi | ₹1,499 |\n\nEach course: 2 sections × 2 lessons (the first lesson is a **preview**), ≈ 2 min per lesson, one 4-question quiz per section (v2), one resource PDF. Lessons are **real CC-BY / CC0 / PD videos from Wikimedia Commons** (`video/webm`, licence-filtered through the API with backoff), sliced by ffmpeg to 90–150 s and pushed through the *real* worker at seed time — so the seed is the pipeline's first integration test. Course thumbnails are the pipeline's poster frames. Credits in `api/app/seed/CREDITS.md`. ~40 seeded enrollments with heartbeats so earnings, retention curves and the pool split show real numbers.\n\n### 5. Versions — base → mid → advanced\nEvery project is cut base → mid → advanced (rule set 2026-09-15), plus one unique free feature as v4 (rule set 2026-09-17). v1 alone is a complete, sellable course platform on our own video stack; each later version adds a money shape or a surface, never a second engine.\n\n| Version | Ships | Proves | ~Hours |\n|---|---|---|---|\n| **v1 Classroom** (base) | Auth (email + password, `sr_session`, roles student / creator / admin; three demo logins) · home, browse by category, course page (curriculum, preview lesson, creator, price) · **buy a course** (Razorpay, idempotent `mark_paid`, enrollment, ledger) · **the player**: hls.js adaptive over encrypted HLS, signed key endpoint, **resume across devices** (heartbeat + beacon), mark complete, course progress · My learning · **Creator studio**: apply → course → sections → lessons, **video upload → worker → live processing status**, resources, publish · **Admin** (dashboard, creator applications, courses / takedown, video jobs / retry) · **certificate PDF** at 100 % with a public `/verify/{code}` · seed (decision 4) | The pipeline, the key server, RBAC, resume | 16 |\n| **v2 All-access** (mid) | Razorpay **Subscriptions** (state machine, grace, cancel-at-period-end) · `can_watch` grows the branch · **quizzes** per section, pass mark gates the certificate · creator **earnings + payout requests**, admin marks paid · emails (Resend: receipt, certificate, payout, approval) · captions (VTT upload) + thumbnail-sprite scrubbing · Continue watching rail | Recurring billing; assessment; the ledger in use | 11 |\n| **v3 Royalties** (advanced) | **Subscription pool split by minutes watched** (monthly close → `pool_share` entries, the math on the earnings page) · creator **analytics**: per-lesson retention curve and drop-off points from heartbeats · **device limit**: the key endpoint counts active playback sessions (max 2) → the security proof gets teeth · full-text course search | Ledger computation; analytics from the player's own telemetry | 8 |\n| **v4 Offline lessons** (unique, free) | Skillroom installs as a **PWA**; \"Download\" on a lesson stores the 480p encrypted segments in Cache Storage; the key arrives under a **48-h offline lease** bound to the device (`POST /lessons/{id}/offline-lease`, requires `can_watch`), refreshed on reconnect; hls.js plays from a custom loader when offline; progress queues and syncs when back online | Reach: the course leaves the network, and the entitlement model survives it (Viraj, 2026-09-17) | 3 |\n\n### 6. Stack and setup — lean\nShared stack from [`projects/README.md`](../README.md): `web/` Next.js App Router + Tailwind 4, `api/` FastAPI on Vercel (FastAPI preset, `bom1`), Neon Postgres, Vercel Blob, own cookie-session auth (`sr_session`), Razorpay (test mode), Resend (v2). New deps: `hls.js` in web; `httpx`, `fpdf2` (certificates), `razorpay` in api; **ffmpeg** on the worker only (never in the Vercel bundle). Setup is the minimum to deploy both apps with plain CI (web typecheck + build, api ruff + pytest). OpenAPI → TS types by script, committed, not CI-gated; no Sentry, no uptime monitor. **Accounts and keys are created just-in-time** in the plan row that first needs them: Neon in S2, Vercel Blob + a GitHub fine-grained token (for `repository_dispatch`) + the Actions secrets in S3, Razorpay in F3, Resend in L4.\n\n## The wow moment (v1)\nDrop a 200 MB screen recording into the studio. The upload bar fills; the job goes *queued → processing*; the three renditions light up one by one; the poster develops. Two minutes later the same lesson plays on your phone, switches to 480p when the network dips, and when you open it on the laptop it asks \"Resume at 4:12?\". Sign out, paste the segment URL into a new tab — a stream of ciphertext. Finish the course; a certificate PDF with your name is waiting, and anyone can verify its code.\n\n## Add-ons (after v4, only from time saved)\nNice-to-have, not priority (Viraj, 2026-09-17): listed in [docs/07-plan.md](docs/07-plan.md) — Q&A per lesson · coupons · drip scheduling · Razorpay Route transfers · ratings & reviews · private podcast feed · embeddable preview player · timestamped notes & bookmarks · co-instructors. Skipping all of them is fine.\n\n## Out of scope (all versions)\nLive classes · DRM (Widevine / FairPlay) · auto-captions or any paid AI · course bundles · affiliate links · multi-currency · a mobile app (the PWA is the app) · real-money billing · mobile studio (creator = desktop) · community / forums · multiple admins.\n\n## Success criteria\n- **A non-enrolled user can never obtain a playable video** — covered by tests: key endpoint 403 without entitlement, expired token 401, token for lesson A refused on lesson B, refund revokes; and by a demo: a raw segment URL in a fresh tab is ciphertext.\n- Upload → playable on a phone in ≤ 3 min for a 2-min 1080p source, with the ladder switching under throttling (DevTools \"Slow 3G\" drops to 240p without a stall > 2 s).\n- Progress resumes on another device within 10 s of stopping; a completed lesson stays completed.\n- A purchase on a phone in under 2 minutes from the course page (demo card); replayed webhooks are no-ops; one enrollment per paid order.\n- Certificate issues exactly once at 100 % (v2: and all quizzes passed); `/verify/{code}` is public and correct.\n- Lighthouse mobile ≥ 90 perf / 100 a11y / 100 SEO on home, browse and course pages (the player page excluded from the perf budget; posters via `next/image`, no CLS).\n- v4: on an Android phone in airplane mode, a downloaded lesson plays from the first tap; the lease expiry is enforced.\n- A visible frontend signature (chosen in step 4, direction **C · Notebook**, [docs/04-ui-mockups.md](docs/04-ui-mockups.md)): **Develop + Stamp** in the studio (renditions tick in, the poster develops, the stamp flips to *ready*), **Resume glide** with a sticky-note toast in the player, curriculum draw and certificate print, themed browser surfaces, reduced-motion fallbacks.\n\n## Resolved questions\n- *Mux / Cloudflare Stream or our own?* Our own: Blob + ffmpeg worker on Actions + AES-128 HLS + API key server (Viraj, 2026-09-17, fork 1). Mux would hide the thing the project proves; Stream is not free.\n- *Purchase or subscription in v1?* Purchase in v1, subscription in v2, the pool split in v3 (fork 2).\n- *Payouts: Route or a ledger?* Ledger + admin-marked payouts; Route is an add-on (fork 3).\n- *Is the admin a UI?* Yes, a small one — four screens; the third role must be visible in the demo (fork 4).\n- *Seed size and where the video comes from?* 6 / 24 / ≤ 700 MB, real CC video from Commons through the real worker (fork 5).\n- *v4?* Offline lessons over the private podcast feed and the embeddable preview player (Viraj, 2026-09-17).\n- *Certificates: which renderer?* `fpdf2` in the API (pure Python, fits the Vercel bundle); no headless browser.\n- *Auth: Better Auth / Drizzle?* No — those were the old TS-stack notes; own cookie session in FastAPI like every other project.\n"}, {"name": "03-requirements", "path": "docs/03-requirements.md", "md": "# Skillroom — Requirements & Scope\n\n**Lifecycle step:** 3 of 17 · **Locked:** 2026-09-17 · **Source:** [PRD.md](../PRD.md) locked decisions. Flows and screen index: [03-user-flows.md](03-user-flows.md).\n\nActors: **Student** (signed in to watch; browsing is public), **Creator** (approved applicant, `/studio`), **Admin** (`/admin`), **Worker** (the transcode script, server-to-server). Each requirement ends with **Accept:** — the check that closes it. Ids: R = v1, R2 = v2, R3 = v3, R4 = v4. Money in ₹, integer paise in the DB.\n\n---\n\n## v1 — Classroom (base, ≈ 16 h)\n\n### R1. Auth & roles\n- Email + password, cookie session (`sr_session`, HttpOnly, SameSite=Lax, 30 d); sign up / in / out. `users.role ∈ {student, creator, admin}`. Three demo logins on the landing (`POST /auth/demo`).\n- `/studio/*` requires `creator` (a student with a pending application sees the application status instead); `/admin/*` requires `admin`; both return 404 to anyone else. `/learn/*`, `/me` require any session.\n- **Creator application:** any student submits `display_name, area, bio, subject` → `creator_profiles.status = applied` → admin approves (role becomes `creator`) or rejects with a note.\n- **Accept:** a student never sees the studio or admin; an approved application unlocks `/studio` on the next request; sessions expire after 30 days.\n\n### R2. Catalogue\n- Home: hero, category strip, \"New courses\", \"Free to start\" (preview lessons), a creator strip.\n- `/courses` and `/courses?category=`: course cards (poster, title, creator, lessons · duration, price or Free); categories = pottery · baking · art · yoga · photography · music (enum).\n- Course page `/c/[slug]`: poster, title, subtitle, creator card (→ `/u/[handle]`), description, **curriculum** (sections → lessons with duration, preview badge, completed ticks when enrolled), price and **Buy** / **Enrol free** / **Continue** depending on state; preview lessons play inline for anyone.\n- Creator page `/u/[handle]`: portrait, bio, area, their published courses.\n- **Accept:** only `published` courses with ≥ 1 `ready` lesson appear; a `takedown` course 404s publicly but stays in the studio; Lighthouse mobile ≥ 90 / 100 / 100 on home, browse and course pages with no CLS.\n\n### R3. Buying a course\n- `POST /checkout { course_id }` → order `SR-####` in `pending_payment` with the course's current price snapshotted → Razorpay order → Standard Checkout modal → `POST /checkout/{id}/verify` (HMAC) → `mark_paid()`; webhook `payment.captured` calls the same function; event ids deduped. Free course (`price_paise = 0`) → `POST /courses/{id}/enrol` creates the enrollment directly.\n- `mark_paid()` in one transaction: order `paid`, `enrollments(user, course, source = purchase, order_id)` (unique per user + course), ledger entries `sale` (+80 % → `creator:{id}`) and `fee` (+20 % → `platform`).\n- Buying a course you already own → 409 `already_enrolled`. An unpaid order older than 30 min is `expired` lazily (nothing to release — no stock).\n- **Accept (tests):** verify-then-webhook and webhook-then-verify → exactly one enrollment and one pair of ledger entries; a replayed webhook is a no-op; the ledger sums to the order amount; a second purchase of the same course is refused.\n\n### R4. The player & progress\n- `/learn/[slug]/[lesson]`: video (hls.js; native HLS on Safari), sidebar curriculum with progress ticks, next / previous, resources list, mark complete, keyboard shortcuts (space, ←/→ 10 s, `f`, `m`), playback speed.\n- `POST /lessons/{id}/play` → `{ master_url (with token), poster_url, resume_at, duration_s }` or 403 `not_entitled` (the page shows the course's buy state). `GET /stream/{lesson}/master.m3u8?t=` · `/{rendition}.m3u8?t=` · `/key?t=` — see [04-technical-design.md](04-technical-design.md) §3–4.\n- **Progress:** heartbeat `POST /lessons/{id}/progress { position_s, watched_delta_s }` every 10 s while playing, on pause / seek, and on unload via `sendBeacon`. Server stores `position_s`, accumulates `watched_s`, marks `completed` at ≥ 90 % or on the button. On open, if `resume_at ≥ 5 s` and `< duration − 10 s`, the player offers **Resume at m:ss** (auto-seeks after 3 s; reduced-motion: no auto).\n- Course progress = completed lessons ÷ ready lessons; the course page, `/me` and the sidebar show it.\n- **Accept (tests):** key endpoint → 403 without entitlement, 401 on an expired or tampered token, 403 when the token's lesson ≠ path lesson; a preview lesson's key is public; progress written on device A is the `resume_at` on device B; `completed` never flips back to false.\n\n### R5. My learning\n- `/me`: enrolled courses with progress bars and \"Continue → lesson\", certificates earned, account (name, email, password). \n- **Accept:** Continue opens the first incomplete lesson at its resume position.\n\n### R6. Creator studio — courses, sections, lessons\n- `/studio`: course list (poster, title, status draft / published / takedown, lessons ready ⁄ total, enrollments, revenue). `/studio/courses/new` → title, subtitle, category, price (₹, 0 = free), description, cover (optional; default = first ready lesson's poster).\n- `/studio/courses/[id]`: sections (add, rename, reorder) → lessons (add, rename, reorder, `is_preview`), each lesson row shows its video state. **Publish** requires ≥ 1 section, ≥ 1 `ready` lesson, a description; unpublish any time; a takedown by admin is shown with the note and cannot be undone by the creator.\n- **Accept:** reorder persists; publishing a course with no ready lesson → 409 `not_publishable` with reasons; a published course appears in `/courses` on the next request.\n\n### R7. Creator studio — video upload & the pipeline\n- `/studio/courses/[id]/lessons/[lid]`: drop zone (mp4 / mov / webm, ≤ 500 MB) → client upload straight to Blob using a token from `POST /creator/lessons/{lid}/video/token` → on completion `POST /creator/lessons/{lid}/video { url, size }` → `video_jobs` row `queued` → API fires `repository_dispatch`. The page shows the job live (poll every 3 s): `queued → processing (rendition ticks 240p ✓ 480p ✓ 720p ✓) → ready` (poster appears, duration, \"Preview it\") or `failed` (error, **Retry**). Re-uploading replaces the video (old prefix deleted after the new one is ready).\n- Resources: PDF / zip ≤ 20 MB per lesson via the same client-upload path; listed on the player.\n- **Worker** (`api/app/worker/transcode.py`): claims the job, downloads the source, runs ffmpeg (ladder + AES-128 + poster + sprite), uploads to Blob `video/{prefix}/…`, reports `POST /internal/jobs/{id}/complete { manifest }` or `/fail { error }`. Runs on GitHub Actions (`.github/workflows/transcode.yml`) in prod, locally by hand.\n- **Accept (tests):** the worker on a 10-s fixture produces three rendition playlists with `#EXT-X-KEY METHOD=AES-128`, encrypted segments (not decodable without the key), a poster and a manifest whose durations sum to the source; a second `complete` for the same job is a no-op; `/internal/*` without the worker secret → 401. **Accept (demo):** a 2-min 1080p upload is playable within 3 min on prod.\n\n### R8. Admin\n- `/admin`: revenue (7 / 30 d), enrollments, pending applications, failed jobs. `/admin/creators`: applications with approve / reject (+ note) and the creator list. `/admin/courses`: every course with takedown / restore (+ note). `/admin/jobs`: video jobs by state with retry (re-dispatch) and the worker's error text.\n- **Accept:** approve → the applicant's next request sees `/studio`; takedown → the public page 404s within the cache window; retry re-queues and re-dispatches exactly one job.\n\n### R9. Certificate\n- When a course reaches 100 % (v2: and every section quiz is passed), `certificates(code 'SR-XXXX-XXXX', user, course, issued_at)` is created once and a PDF (`fpdf2`: name, course, creator, date, code, QR-less verify URL) is written to Blob. `/certificates/[code]` (owner) shows and downloads it; `/verify/[code]` is public: name, course, creator, date, valid ✓.\n- **Accept (test):** completing the last lesson twice issues one certificate; `/verify` of an unknown code → \"not found\", never a 500.\n\n### R10. Seed & content\n- Idempotent seed: admin, demo student, 6 creators (approved), 6 courses / 12 sections / 24 lessons / 6 resources, 24 CC videos fetched by `seed/fetch_videos.py` (Commons API, licence filter, backoff, `CREDITS.md`), sliced to 90–150 s and pushed through the real worker (`seed.py videos` runs it locally against the seeded jobs); ~40 enrollments across 10 seeded students with progress and heartbeats over the last 60 days; the demo student's completed course has a certificate.\n- **Accept:** `seed` runs twice without duplicates; every lesson is `ready`; Blob usage ≤ 70 % of the Hobby quota; `eval_stream.py` plays every master playlist through hls.js's parser without error.\n\n---\n\n## v2 — All-access (mid, ≈ 11 h)\n\n### R2-1. Subscriptions\n- `/all-access`: ₹499 / month, what's included; `POST /subscriptions` creates a Razorpay subscription on the seeded plan → hosted / modal authorisation → webhooks `subscription.authenticated / activated / charged / halted / cancelled / completed` (deduped) drive `subscriptions.state`; `current_end` from the charge. Cancel-at-period-end from `/me`. **Grace:** `halted` counts as active for 3 days.\n- `can_watch` gains `active_subscription(user)`; enrollments via subscription are created lazily on first play (`source = subscription`) so progress and certificates work the same.\n- **Accept (tests):** every webhook edge of the state table; a replayed event is a no-op; a `halted` sub watches for 3 days then 403s; cancel-at-period-end keeps access until `current_end`.\n\n### R2-2. Quizzes\n- Studio: one quiz per section (pass mark %, 3–8 questions, 2–4 options, one correct). Player: after the section's last lesson, `/learn/[slug]/quiz/[id]` — answer, submit, score, retry. Certificate requires every section quiz passed.\n- **Accept:** a failed quiz blocks the certificate; the best attempt is shown; questions never leak the correct index to the client before submission.\n\n### R2-3. Earnings & payouts\n- `/studio/earnings`: balance available / pending / paid, entries list (sale, fee, refund, payout), **Request payout** (≥ ₹500, one open request at a time). `/admin/payouts`: requested → paid (bank reference) or rejected (note). Refunds (admin, per order) write negative `sale` / `fee` entries.\n- **Accept (tests):** balance = Σ entries; a request above available → 422; marking paid writes the `payout` entry once.\n\n### R2-4. Emails\n- Resend + React Email: purchase receipt (with the course link), certificate issued (PDF link), payout paid, creator approved / rejected; forgot / reset password.\n- **Accept:** the receipt arrives within a minute of `paid` with a working link.\n\n### R2-5. Captions, scrubbing, continue watching\n- Creators upload a `.vtt` per lesson (client upload) → `<track>` in the player; the v1 sprite + a generated `thumbnails.vtt` power hover-preview on the scrub bar; home shows **Continue watching** for signed-in students.\n- **Accept:** captions toggle with `c`; hovering the bar shows the right frame within ±5 s.\n\n---\n\n## v3 — Royalties (advanced, ≈ 8 h)\n\n### R3-1. The pool\n- Heartbeats from subscription-sourced enrollments accumulate `watch_minutes(month, creator_id, course_id, user_id, seconds)`. `POST /admin/pool/close { month }` (once per month; idempotent): pool = Σ captured subscription charges × 80 %; per creator `share = pool × minutes_c ÷ minutes_total` → `pool_share` ledger entries + a `pool_closes` row (pool, total minutes, per-creator lines). The creator's earnings page shows \"₹4,120 · 1,240 subscriber-minutes · 12.3 % of the pool\".\n- **Accept (tests):** shares sum to the pool within rounding (remainder to the largest share); closing twice is a no-op; a creator with zero minutes gets no entry.\n\n### R3-2. Creator analytics\n- Heartbeats also upsert `watch_buckets(lesson_id, bucket_10s, viewers)`; `/studio/courses/[id]/analytics`: per-lesson retention curve (viewers per 10-s bucket ÷ starters), drop-off markers on the biggest falls, completion rate, average watched %.\n- **Accept:** the curve for a seeded lesson matches a SQL check; buckets never exceed starters.\n\n### R3-3. Device limit\n- `playback_sessions(user, lesson, device_id, last_seen)`; the key endpoint upserts the caller's device and counts devices active in the last 5 min; > 2 → 403 `too_many_devices` (the player names the limit). Preview lessons exempt.\n- **Accept (test):** three devices within 5 min → the third is refused; after 5 min idle it is admitted.\n\n### R3-4. Search\n- `courses.search tsvector` (title A, subtitle + tags B, description C) with GIN; `/courses?q=` ranks by `ts_rank`; the browse page shows a search box.\n- **Accept:** \"naan\" finds the flatbreads course by description alone.\n\n---\n\n## v4 — Offline lessons (unique, free, ≈ 3 h)\n\n### R4-1. PWA + download\n- `manifest.webmanifest`, service worker (app shell precached: `/learn/*` shell, fonts, icons), install prompt on the player (dismissible, remembered). **Download** on a lesson: the client fetches the 480p rendition playlist and every segment and stores them in Cache Storage under `offline/{lesson_id}`; `POST /lessons/{id}/offline-lease { device_id }` (requires `can_watch`) returns the key bytes + `lease_expires_at` (48 h) → IndexedDB. Storage used and \"Remove\" on `/me`.\n- **Offline playback:** when `navigator.onLine` is false or the network fails, hls.js uses a custom loader that serves playlist, segments and key from the cache / IDB; a lease past `lease_expires_at` refuses to play (\"Reconnect to renew\") and is deleted. Progress writes queue in IDB and flush on reconnect (last write wins by client timestamp ≤ server time).\n- **Accept:** on Android in airplane mode a downloaded lesson plays from the first tap; an expired lease refuses; a refund makes the next online lease refresh fail and the download is removed; iOS Safari gets the same download UI (Cache Storage works) with the install card hidden.\n\n---\n\n## Out of scope (all versions)\nLive classes · DRM · auto-captions / paid AI · bundles · affiliates · multi-currency · native apps · real-money billing · mobile studio · community · multiple admins · watermarking · per-lesson pricing · instalments.\n"}, {"name": "03-user-flows", "path": "docs/03-user-flows.md", "md": "# Skillroom — User Flows & Screen Index\n\n**Lifecycle step:** 3 of 17 · **Locked:** 2026-09-17 · Pairs with [03-requirements.md](03-requirements.md); every screen below gets a mockup in [04-ui-mockups.md](04-ui-mockups.md).\n\n## Flow 1 — Browse to watching (v1, the main path)\n\n```mermaid\nflowchart LR\n  H[S1 Home] --> B[S2 Browse · category]\n  H --> C[S3 Course page]\n  B --> C\n  C -->|preview lesson| P[S4 Player · preview]\n  C -->|Buy| K[S5 Buy sheet → Razorpay modal]\n  K -->|verify HMAC · mark_paid| C2[S3 Course page · Enrolled]\n  C -->|Enrol free| C2\n  C2 -->|Start / Continue| P2[S4 Player · resume]\n  P2 -->|last lesson complete| CE[S7 Certificate]\n  P2 --> ME[S6 My learning]\n```\n\n## Flow 2 — Video: upload → worker → playable (v1, the hard part)\n\n```mermaid\nsequenceDiagram\n  participant CR as Creator (studio)\n  participant BL as Vercel Blob\n  participant API as FastAPI\n  participant GH as GitHub Actions\n  participant W as Worker (transcode.py)\n  CR->>API: POST /creator/lessons/{id}/video/token\n  API-->>CR: client upload token (path video-src/{lesson}/…)\n  CR->>BL: PUT source (client upload, ≤ 500 MB)\n  CR->>API: POST /creator/lessons/{id}/video {url, size}\n  API->>API: videos row (key generated) · video_jobs queued\n  API->>GH: repository_dispatch transcode {job_id}\n  CR->>API: GET /creator/lessons/{id}/video (poll 3 s)\n  GH->>W: run python -m app.worker.transcode --job\n  W->>API: POST /internal/jobs/{id}/claim → source url, key, prefix\n  W->>BL: GET source\n  W->>W: ffmpeg → 240/480/720p HLS · AES-128 · poster · sprite\n  W->>BL: PUT video/{prefix}/{rendition}_%03d.ts · poster.jpg · sprite.jpg\n  W->>API: POST /internal/jobs/{id}/complete {manifest}\n  API->>API: videos.status ready · lesson duration · course cover\n  API-->>CR: status ready (poll) → \"Preview it\"\n```\n\n## Flow 3 — Playback and the key server (v1)\n\n```mermaid\nsequenceDiagram\n  participant S as Student (player)\n  participant API as FastAPI\n  participant BL as Blob CDN\n  S->>API: POST /lessons/{id}/play\n  API->>API: can_watch(user, lesson)? → token t = HMAC(user, lesson, exp 1h)\n  API-->>S: {master_url?t, poster, resume_at, duration}\n  S->>API: GET /stream/{lesson}/master.m3u8?t\n  API-->>S: 3 renditions → /stream/{lesson}/{r}.m3u8?t\n  S->>API: GET /stream/{lesson}/480p.m3u8?t\n  API-->>S: #EXT-X-KEY URI=/stream/{lesson}/key?t · segments → Blob URLs\n  S->>API: GET /stream/{lesson}/key?t\n  API->>API: verify t · can_watch again · (v3: device count ≤ 2)\n  API-->>S: 16 bytes · no-store\n  S->>BL: GET video/{prefix}/480p_000.ts (ciphertext)\n  S->>S: hls.js decrypts · plays · switches rendition on bandwidth\n  loop every 10 s / pause / seek / unload\n    S->>API: POST /lessons/{id}/progress {position_s, watched_delta_s}\n  end\n```\n\n## Flow 4 — Video job state machine (v1)\n\n```mermaid\nstateDiagram-v2\n  [*] --> queued: POST /creator/lessons/{id}/video\n  queued --> processing: worker claim (attempts + 1)\n  processing --> ready: complete {manifest}\n  processing --> failed: fail {error} · or claim older than 20 min (stale)\n  failed --> queued: admin / creator retry → re-dispatch\n  ready --> queued: creator re-uploads (new prefix; old deleted when ready)\n```\n\n## Flow 5 — Buy → enrol → ledger (v1) and refund (v2)\n\n```mermaid\nstateDiagram-v2\n  [*] --> pending_payment: POST /checkout {course}\n  pending_payment --> paid: verify or webhook payment.captured → mark_paid()\n  pending_payment --> expired: 30 min lazy\n  pending_payment --> failed: payment.failed\n  paid --> refunded: admin refund (v2) → negative sale + fee entries, enrollment revoked\n  note right of paid\n    mark_paid(): order paid · enrollment(source purchase) ·\n    ledger sale +80% creator · fee +20% platform — one transaction, idempotent\n  end note\n```\n\n## Flow 6 — Creator lifecycle (v1) and payouts (v2)\n\n```mermaid\nflowchart LR\n  A[S8 Apply] -->|creator_profiles applied| AD[S14 Admin · creators]\n  AD -->|approve → role creator| ST[S9 Studio · courses]\n  AD -->|reject + note| A\n  ST --> ED[S10 Course editor · sections · lessons]\n  ED --> LS[S11 Lesson · upload · job status]\n  LS -->|ready| ED\n  ED -->|publish · ≥ 1 ready lesson| PUB[Published → S2 Browse]\n  subgraph v2 payouts\n    EA[S12 Earnings] -->|Request payout ≥ ₹500| PO[S16 Admin · payouts]\n    PO -->|mark paid + reference| EA\n  end\n```\n\n## Flow 7 — Subscription state machine (v2)\n\n```mermaid\nstateDiagram-v2\n  [*] --> created: POST /subscriptions\n  created --> authenticated: webhook subscription.authenticated\n  authenticated --> active: subscription.activated / charged (current_end set)\n  active --> active: subscription.charged (current_end rolls)\n  active --> halted: subscription.halted (charge failed) — 3-day grace keeps access\n  halted --> active: subscription.charged\n  halted --> cancelled: subscription.cancelled\n  active --> cancelled: user cancel-at-period-end (access until current_end) / webhook cancelled\n  active --> completed: subscription.completed\n  cancelled --> [*]\n```\n\n## Flow 8 — Offline lesson (v4)\n\n```mermaid\nflowchart LR\n  P[S4 Player · Download] -->|GET 480p playlist + segments| CS[(Cache Storage offline/lesson)]\n  P -->|POST /lessons/id/offline-lease · can_watch| L[(IndexedDB · key + lease 48 h)]\n  OFF[Offline · airplane mode] --> LD[hls.js custom loader → cache + IDB]\n  LD -->|lease valid| PLAY[Plays]\n  LD -->|lease expired| REN[Reconnect to renew]\n  PLAY -->|progress queued| Q[(IDB queue)]\n  Q -->|back online| API[POST /lessons/id/progress · lease refresh]\n```\n\n## Screen index\n\n| # | Screen | Route | Who | Version | Notes |\n|---|---|---|---|---|---|\n| S1 | Home | `/` | all | v1 · Continue watching in v2 | Exists as landing; becomes the catalogue home (hero, categories, new courses, free to start, creators) |\n| S2 | Browse | `/courses`, `/courses?category=` | all | v1 · search in v3 | Course cards, category chips |\n| S3 | Course page | `/c/[slug]` | all | v1 | Poster, curriculum with preview badges and ticks, creator card, Buy / Enrol free / Continue |\n| S4 | Player | `/learn/[slug]/[lesson]` | student | v1 · captions + scrubbing in v2 · quiz link in v2 · Download in v4 | hls.js, sidebar curriculum, resources, **Resume** moment, mark complete |\n| S5 | Buy sheet | `/c/[slug]` (sheet) → Razorpay modal → back | student | v1 | Price, what you get, Pay; dismissed state |\n| S6 | My learning | `/me` | student | v1 · subscription card in v2 · downloads in v4 | Enrolled courses with progress, certificates, account |\n| S7 | Certificate + Verify | `/certificates/[code]`, `/verify/[code]` | student / public | v1 | PDF view + download; public verify page |\n| S8 | Sign in / up + Apply | `/sign-in`, `/sign-up`, `/apply` | all | v1 | Demo buttons (student, creator, admin); creator application form + status |\n| S9 | Studio: courses | `/studio` | creator | v1 | Course list with status, lessons ready ⁄ total, enrollments, revenue |\n| S10 | Studio: course editor | `/studio/courses/[id]` | creator | v1 · quiz editor in v2 · analytics tab in v3 | Details, sections → lessons with video state, publish checklist |\n| S11 | Studio: lesson + video | `/studio/courses/[id]/lessons/[lid]` | creator | v1 · captions in v2 | Drop zone, upload bar, **job status (queued → processing → ready)**, poster, resources |\n| S12 | Studio: earnings | `/studio/earnings` | creator | v1 (read) · payouts in v2 · pool math in v3 | Balance, entries, request payout |\n| S13 | Admin: dashboard | `/admin` | admin | v1 | Revenue, enrollments, pending applications, failed jobs |\n| S14 | Admin: creators | `/admin/creators` | admin | v1 | Applications approve / reject; creator list |\n| S15 | Admin: courses + jobs | `/admin/courses`, `/admin/jobs` | admin | v1 | Takedown / restore; jobs by state with retry and error text |\n| S16 | Admin: payouts | `/admin/payouts` | admin | v2 | Requested → paid (reference) / rejected |\n| S17 | Quiz | `/learn/[slug]/quiz/[id]` | student | v2 | Questions, submit, score, retry |\n| S18 | All-access | `/all-access` | all | v2 | ₹499 / month, subscribe, manage from `/me` |\n| S19 | Creator page | `/u/[handle]` | all | v1 | Portrait, bio, area, published courses |\n| S20 | States | various | all | v1 · offline in v4 | Not enrolled (preview only), video processing, video failed, takedown 404, expired lease / offline |\n"}, {"name": "04-technical-design", "path": "docs/04-technical-design.md", "md": "# Skillroom — Technical Design\n\n**Lifecycle step:** 4 of 17 · **Locked:** 2026-09-17 · UI companion: [04-ui-mockups.md](04-ui-mockups.md). Schema and routes: [06-data-and-api.md](06-data-and-api.md).\n\n## 1. Stack (shared stack, one addition: the worker)\n| Layer | Choice | Notes |\n|---|---|---|\n| web/ | Next.js 15 App Router · TypeScript strict · Tailwind 4 · pnpm | UI only; `/api/*` rewritten to the API so cookies are same-origin. New: **`hls.js`**, `@vercel/blob` (client upload helper only — the token comes from the API) |\n| api/ | FastAPI (Python 3.12, uv) · SQLAlchemy 2.0 async + Alembic · pydantic · pytest | Vercel FastAPI preset, `bom1`. New: `httpx`, **`fpdf2`** (certificates), `razorpay`, `python-multipart` |\n| **worker/** | `api/app/worker/transcode.py` + **ffmpeg** | Same package as the API, never imported by it; runs on a **GitHub Actions** runner in prod (`.github/workflows/transcode.yml`), by hand locally. ffmpeg is never in the Vercel bundle |\n| Data | Neon Postgres | Users, courses, videos + manifests, jobs, enrollments, orders, ledger, progress |\n| Files | Vercel Blob | Video sources, HLS output (encrypted), posters, sprites, resources, certificate PDFs |\n| Payments | Razorpay Standard Checkout (v1) + Subscriptions (v2), test mode | Orders, verify, webhooks, refunds |\n| Email (v2) | Resend + React Email | Receipts, certificate, payout, approval, reset |\n| Contract | `api/openapi.json` → `openapi-typescript` → `web/src/lib/api-types.ts` | `pnpm gen:api`; committed; not CI-gated |\n| CI | GitHub Actions: `web` (typecheck + build), `api` (ruff + pytest with a Postgres service; the worker test runs because ubuntu runners ship ffmpeg) | Plus the `transcode` workflow, which is not CI — it is the worker |\n\n## 2. Domain model\n- `users(role student|creator|admin)` → `creator_profiles(status applied|approved|rejected, handle, display_name, area, bio, avatar_url, payout_note)`.\n- `courses(creator_id, slug, title, subtitle, category, level, price_paise, description, cover_url, status draft|published|takedown, takedown_note)` → `sections(sort)` → `lessons(sort, is_preview, duration_s)` → **`videos`** (one per lesson: `source_url, prefix, key_hex, status none|queued|processing|ready|failed, manifest jsonb, poster_url, sprite_url, duration_s`) and `video_jobs(video_id, state, attempts, error, claimed_at, finished_at)`; `resources(lesson_id, name, url, size)`.\n- `enrollments(user, course, source purchase|free|subscription|admin, order_id)`; `progress(user, lesson, position_s, watched_s, completed, updated_at)`; `certificates(code, user, course, pdf_url)`.\n- `orders(number 'SR-####', user, course, amount_paise, state, razorpay ids)`; `ledger_entries(account 'platform'|'creator:{id}', kind sale|fee|refund|payout|pool_share, amount_paise signed, order_id?, payout_id?, period?)`. Balance = Σ entries per account, always computed, never stored.\n- Money is integer paise; the web formats ₹.\n\n## 3. The video pipeline (worker)\n`python -m app.worker.transcode --job <id>` (or `--poll` to drain the queue locally):\n1. **Claim:** `POST /internal/jobs/{id}/claim` (Bearer `WORKER_SECRET`) → `{ source_url, prefix, key_hex, iv_hex, lesson_id }`; the API flips `queued → processing`, `attempts + 1`, `claimed_at`. A job already `processing` for < 20 min → 409 (another runner has it).\n2. **Download** the source to a temp dir with `httpx` (streamed).\n3. **Probe:** `ffprobe -show_streams -show_format` → duration, width, height, has_audio. Sources shorter than 720p only get the renditions ≤ their height (never upscale); no audio → a silent AAC track is synthesised so the ladder stays uniform.\n4. **Ladder + encryption** in one ffmpeg pass:\n   ```\n   ffmpeg -y -i src -filter_complex \"[0:v]split=3[a][b][c];[a]scale=-2:240[v0];[b]scale=-2:480[v1];[c]scale=-2:720[v2]\" \\\n     -map [v0] -map [v1] -map [v2] -map 0:a -map 0:a -map 0:a \\\n     -c:v libx264 -preset veryfast -profile:v main -g 144 -keyint_min 144 -sc_threshold 0 \\\n     -b:v:0 200k -maxrate:v:0 240k -bufsize:v:0 400k  -b:v:1 500k -maxrate:v:1 600k -bufsize:v:1 1000k  -b:v:2 1000k -maxrate:v:2 1200k -bufsize:v:2 2000k \\\n     -c:a aac -b:a 48k -ac 1 \\\n     -f hls -hls_time 6 -hls_playlist_type vod -hls_flags independent_segments \\\n     -hls_key_info_file key.info -hls_segment_filename \"out/%v_%03d.ts\" \\\n     -var_stream_map \"v:0,a:0,name:240p v:1,a:1,name:480p v:2,a:2,name:720p\" out/%v.m3u8\n   ```\n   `key.info` = the placeholder URI `KEY_URI`, the local `key.bin` (16 bytes from `key_hex`), and `iv_hex`. ffmpeg writes AES-128-CBC segments; the playlists it writes are only parsed for segment durations — **the API generates the playlists it serves**.\n5. **Poster** at 10 % of the duration (`-frames:v 1 -vf scale=1280:-2`, JPEG q80) and a **sprite** (`fps=1/5, scale=160:-2, tile=10xN`, one frame every 5 s) with its geometry.\n6. **Upload** to Blob: `video/{prefix}/{rendition}_{nnn}.ts`, `video/{prefix}/poster.jpg`, `video/{prefix}/sprite.jpg` (Blob REST `put`, 8 parallel, retried). `prefix` = 22 random URL-safe chars per video — unguessable, and the bytes are ciphertext anyway.\n7. **Complete:** `POST /internal/jobs/{id}/complete { manifest }` where `manifest = { duration_s, width, height, iv_hex, renditions: [{ name, bandwidth, width, height, codecs, segments: [6.0, 6.0, …] }], poster_url, sprite: { url, cols, rows, w, h, interval_s } }`. The API sets `videos.status = ready`, `lessons.duration_s`, the course cover if unset, deletes the old prefix on a replacement, and revalidates. Any exception → `POST /internal/jobs/{id}/fail { error }` (first 2 KB of ffmpeg's stderr). Idempotent: a second `complete` for a `ready` job → 200 no-op.\n\n**Where it runs:** the API fires `POST https://api.github.com/repos/{GITHUB_REPO}/dispatches { event_type: \"transcode\", client_payload: { job_id } }` with a fine-grained token (Contents: read + write, this repo only). `transcode.yml`: `on: repository_dispatch: types: [transcode]` → checkout → `uv sync --directory api` → run the worker with `API_URL`, `WORKER_SECRET`, `BLOB_READ_WRITE_TOKEN` from Actions secrets; `timeout-minutes: 30`. Runner start ≈ 15–30 s, a 2-min 1080p source ≈ 60–90 s, upload ≈ 10 s → **≈ 2 min** upload-to-playable. Dispatch failure (GitHub down) leaves the job `queued` with `dispatch_error`; admin retry re-fires. **Locally:** the same command against `http://localhost:8000`; the seed runs it with `--poll` over the seeded jobs.\n\n**Why Actions and not a Vercel function:** a 3-rendition encode of a 2-min 1080p file needs 2–4 CPU-minutes; Hobby functions cap at 300 s on one vCPU and ffmpeg would take a third of the 250 MB bundle. Actions gives 4 vCPU, ffmpeg preinstalled and free minutes; the worker is plain Python either way, so moving it to a container later is a change of `runs-on`, not of code.\n\n## 4. Upload (client → Blob) and the token\nVercel functions cap request bodies at 4.5 MB, so video never passes through the API. The studio uses `@vercel/blob/client`'s `upload(pathname, file, { access: 'public', handleUploadUrl: '/api/creator/lessons/{id}/video/token', onUploadProgress })`. The API implements the handle-upload protocol: on `{ type: 'blob.generate-client-token', payload: { pathname } }` it checks the creator owns the lesson, forces `pathname = video-src/{lesson_id}/{uuid}.{ext}`, and returns a **client token** generated the way the JS SDK does it (`generateClientTokenFromReadWriteToken`: HMAC-SHA256 of the JSON payload `{ pathname, maximumSizeInBytes: 500 MB, allowedContentTypes: [video/mp4, video/quicktime, video/webm], validUntil: now + 1 h, addRandomSuffix: false }` with the store's RW token, base64-wrapped with the store id — ~20 lines, unit-tested against a token the SDK produced). The browser then PUTs straight to Blob (multipart for > 100 MB) and, on success, calls `POST /creator/lessons/{id}/video { url, size }`; the API `HEAD`s the blob with the RW token, checks the pathname prefix and size, generates `key_hex` + `iv_hex`, writes `videos` + `video_jobs(queued)`, and dispatches. Resources (PDF / zip ≤ 20 MB) and captions (v2) use the same path with their own prefixes.\n\n## 5. Playback: playlists, token, key server\n- **Token:** `POST /lessons/{id}/play { device_id }` → `can_watch(user, lesson)` → `t = b64url({ u, l, d, exp: now + 3600 }) + \".\" + b64url(HMAC-SHA256(PLAYBACK_SECRET, payload))`. Returned inside `master_url = /api/stream/{lesson}/master.m3u8?t=…`. Preview lessons get a token with `u = \"anon\"`.\n- **`GET /stream/{lesson}/master.m3u8?t=`** → verify `t` (signature, `exp`, `l == lesson`) → `#EXT-X-STREAM-INF:BANDWIDTH=…,RESOLUTION=…,CODECS=\"avc1.4d401f,mp4a.40.2\"` per rendition in the manifest → `{name}.m3u8?t=…`. `Cache-Control: private, no-store`.\n- **`GET /stream/{lesson}/{name}.m3u8?t=`** → `#EXT-X-VERSION:3`, `#EXT-X-TARGETDURATION:7`, `#EXT-X-PLAYLIST-TYPE:VOD`, `#EXT-X-KEY:METHOD=AES-128,URI=\"key?t=…\",IV=0x{iv}`, then `#EXTINF:{d},` + `https://{blob}/video/{prefix}/{name}_{nnn}.ts` per segment, `#EXT-X-ENDLIST`. Relative `key?t=` resolves against the playlist URL in every player.\n- **`GET /stream/{lesson}/key?t=`** — the authorization boundary: verify `t` → **re-run `can_watch`** against the DB (a refund or a takedown revokes here, not at token expiry) → v3: upsert `playback_sessions(u, l, d, now)`, count devices seen in 5 min, `> 2 → 403 too_many_devices` → return the 16 bytes as `application/octet-stream`, `no-store`. Anonymous tokens only unlock `is_preview` lessons.\n- **`can_watch(user, lesson)`** = `lesson.video.status == ready and course.status == published and (lesson.is_preview or enrolled(user, course) or active_subscription(user))` — one function in `services/entitlement.py`, used by play, key, offline-lease (v4) and the course page's state.\n- **Player:** `hls.js` when `Hls.isSupported()`, else `<video src={master_url}>` (Safari, iOS). `startPosition: resume_at`; ABR left to hls.js (`capLevelToPlayerSize: true`); `xhrSetup` untouched — no headers, the token rides the URL so native HLS works. Errors: `keyLoadError` with 403 → \"This lesson isn't in your library\" and the buy state; 401 → re-request `/play` once (expired token) and reload the source.\n\n## 6. Progress and resume\n`POST /lessons/{id}/progress { position_s, watched_delta_s, client_ts }` every 10 s while playing, on pause, on seek, and on `pagehide` via `navigator.sendBeacon` (a `text/plain` JSON body so it stays a simple request). Server: `progress` upsert with `position_s = $pos`, `watched_s += min(delta, 15)`, `completed = completed or pos ≥ 0.9 × duration`, `updated_at = now()`; the response echoes `course_progress`. `/play` returns `resume_at = position_s` unless `completed` (then 0) or `position_s > duration − 10`. The player shows **Resume at m:ss** for 3 s then seeks (reduced motion: shows the button, no auto-seek). Two devices writing at once: last write wins by server time — the acceptable behaviour for a course player. Marking complete is `POST /lessons/{id}/complete`; completion is monotonic. Certificate check runs inside the same transaction: if every ready lesson is `completed` (v2: and every section quiz has a passing attempt) and no certificate exists → `issue_certificate()`.\n\n## 7. Money\n- **Checkout (v1):** `POST /checkout { course_id }` → 409 `already_enrolled` / 422 `free_course` → `orders(pending_payment, amount = course.price_paise)` → Razorpay `order.create` → `{ order_id, number, razorpay_order_id, key_id, amount_paise }`. Verify and webhook both call **`mark_paid(order, payment_id)`** under `select … for update`: if `pending_payment` → `paid`, `enrollments` insert (`on conflict do nothing`), two ledger entries; else no-op. `webhook_events.id` unique → replay = 200. Expiry lazy at 30 min (nothing to release).\n- **Ledger:** `sale = round(amount × 0.80)`, `fee = amount − sale` (no rounding drift). Refund (v2, admin): Razorpay refund → `refunded` → entries `refund` −sale to the creator, −fee to the platform → enrollment deleted (progress kept).\n- **Subscriptions (v2):** plan `SR-ALLACCESS-499` created once by `scripts/create_plan.py` → `POST /subscriptions` → Razorpay `subscription.create(total_count 120)` → the checkout modal with `subscription_id` → webhooks drive `subscriptions.state` (table in 03-user-flows Flow 7); `active_subscription(user)` = `state in (active, authenticated) or (state = halted and updated_at > now − 3 d) or (state = cancelled and current_end > now)`.\n- **Payouts (v2):** `POST /creator/payouts { amount }` → 422 unless `≤ available` and `≥ 50000` paise and no open request → `payouts(requested)`; admin `POST /admin/payouts/{id}/pay { reference }` → `payout` entry −amount, `paid`. Available = balance − Σ requested.\n- **Pool (v3):** `POST /admin/pool/close { month }` → `pool = Σ subscription charges captured in month × 0.80`; `minutes_c` from `watch_minutes` where `source = subscription`; `share_c = floor(pool × minutes_c / total)`; the remainder goes to the largest share; entries `pool_share` with `period = month`; `pool_closes` row; re-running → 409 `already_closed`.\n\n## 8. Certificates\n`services/certificates.py::issue(user, course)` → `code = 'SR-' + 2 × 4 base32 chars`, `fpdf2` A4 landscape with the bundled Onest TTFs, the course title, student name, creator, date, code and `https://skillroom.virajdomadia.com/verify/{code}` → Blob `certificates/{code}.pdf` → row. `/verify/{code}` is a public API read (`GET /verify/{code}` → name, course, creator, issued_at) rendered server-side with `noindex`.\n\n## 9. Web\n- **Rendering:** home, browse, course, creator pages are dynamic with tag caching (`courses`, `course:{slug}`) and `revalidate: 300`; the API calls `POST web/api/revalidate` on publish / takedown / video ready. Player, `/me`, studio, admin: dynamic `no-store`. `next/image` for posters (Blob host in `remotePatterns`, `sizes` per grid), aspect boxes reserved (no CLS).\n- **Player page:** one client component (`components/player/Player.tsx`): `/play` on mount → `hls.js` (dynamic import) → `useHeartbeat` (10-s interval bound to `playing`, flush on pause / seek / `pagehide`) → sidebar `Curriculum` with ticks → `ResumeToast` → keyboard map. Sprite scrubbing (v2) reads the manifest's sprite geometry; captions (v2) add `<track>`.\n- **Studio upload:** `components/studio/VideoPanel.tsx`: drop zone → `upload()` with progress → completion POST → `useJobStatus` polling `GET /creator/lessons/{id}/video` every 3 s until `ready | failed` → rendition ticks, poster reveal, \"Preview it\" (plays through the real key server with the creator's own entitlement — creators can always watch their own lessons).\n- **Studio / admin shells:** `app/(studio)/studio/*` and `app/(admin)/admin/*` behind layouts that 404 for the wrong role (role from `/auth/me`, re-checked by the API on every call).\n- **Offline (v4):** `manifest.webmanifest`, `sw.js` (Workbox-free, hand-written: precache the app shell, network-first for pages, cache-first for `/offline/*`). Download = fetch the 480p playlist through the API, then every segment URL into `caches.open('offline-{lesson}')`, plus the key + lease into IndexedDB (`idb-keyval`). Custom hls.js `loader` (extends the default `XhrLoader`): if the URL is a cached segment / playlist / key and (offline or cache-first flag) → serve from cache; the key loader checks `lease_expires_at`. Progress: `useHeartbeat` writes to an IDB queue when offline; `online` event flushes in order.\n- **Motion signature and visual direction:** decided in [04-ui-mockups.md](04-ui-mockups.md) from the variant page. On the table: *Develop* (the poster develops from blur as renditions tick in), *Resume glide* (the playhead glides to the resume point along a lit track), *Curriculum draw* (the course outline draws itself, ticks are stroked), *Certificate print* (the certificate feeds out and the seal stamps), *Ladder* (renditions build as three bars, segments tick), *Chapter count* (lesson numbers roll like a counter).\n\n## 10. Auth & access\nOwn session auth as the other projects: `users(email citext, password_hash argon2, name, role)`, `sessions(id, user_id, expires_at)`, cookie `sr_session` HttpOnly SameSite=Lax 30 d. `POST /auth/demo { as: student|creator|admin }` for the landing buttons. Dependencies `require_user`, `require_creator` (404 otherwise), `require_admin` (404), `require_worker` (Bearer `WORKER_SECRET`, 401). Creators may only read / write their own courses (`course.creator_id == me`), checked in every studio route.\n\n## 11. Caching & rendering\nCatalogue reads: `s-maxage=300, stale-while-revalidate=600` + web tag cache. `/stream/*`, `/lessons/*`, `/me`, studio, admin: `private, no-store`. Blob objects are immutable by name (new prefix per upload) so the CDN caches them forever. Posters via `next/image` with 1-year cache.\n\n## 12. Failure modes worth handling\n| Failure | Behaviour |\n|---|---|\n| GitHub dispatch fails | Job stays `queued` with `dispatch_error`; studio shows \"Waiting for a worker\"; admin / creator retry re-dispatches |\n| Runner never claims (Actions outage) | `queued` > 10 min shows the same message; a `workflow_dispatch` of `transcode.yml` with `--poll` drains the queue by hand |\n| ffmpeg fails / unsupported codec | `failed` with the stderr tail; creator sees the reason, can re-upload or retry |\n| Worker dies mid-job | `processing` > 20 min is treated as stale: claimable again, `attempts` capped at 3 then `failed` |\n| Blob quota reached | `put` 4xx → `failed: storage_quota`; admin dashboard shows Blob usage from the seed script's last count |\n| Token expired mid-lesson | hls.js `keyLoadError` 401 → the player calls `/play` again once and reloads at the current position |\n| Refund / takedown while watching | The next key request 403s (keys are fetched once per playlist, so the current session ends at the next rendition switch or reload) |\n| Two devices playing (v3) | The third device's key request → 403 `too_many_devices`, named in the player |\n| Razorpay modal dismissed | Order stays `pending_payment` 30 min; the buy sheet can re-open the same order |\n| Webhook before verify / replayed | `mark_paid` idempotent; `webhook_events.id` unique |\n| Client upload completes but the completion POST never arrives | The source sits unreferenced in `video-src/`; `scripts/gc_blob.py` lists and deletes orphans older than a day (run by hand) |\n| Offline lease expired (v4) | Player refuses with \"Reconnect to renew\"; the next online `/play` refreshes the lease silently |\n| Safari / iOS | Native HLS; key via query token; no `hls.js` custom loader → v4 offline is Chromium/Android-first, iOS keeps Download hidden |\n\n## 13. Testing (only these)\n- `test_rbac`: student → `/studio/*`, `/admin/*` = 404; creator → other creator's course = 404; worker routes without the secret = 401.\n- `test_key_endpoint`: no entitlement 403; preview lesson anonymous 200; expired token 401; tampered signature 401; token for lesson A on lesson B 403; after refund 403.\n- `test_playlists`: master and media playlists generated from a manifest fixture parse (m3u8 grammar), carry `EXT-X-KEY` with the IV and absolute segment URLs, durations match.\n- `test_worker` (skipped if no ffmpeg): a 10-s colour-bar fixture → three rendition playlists, encrypted segments that fail to demux without the key and demux with it, a poster, a manifest whose durations sum to 10 ± 0.5 s; run with a `FakeBlob` that writes to a temp dir and a fake API.\n- `test_upload_token`: the client token matches one generated by the JS SDK for the same payload (fixture).\n- `test_mark_paid`: verify-then-webhook and webhook-then-verify → one enrollment, one sale + one fee summing to the amount; replay no-op; `already_enrolled` 409.\n- `test_progress`: heartbeat from device A → `/play` on device B returns `resume_at`; completion monotonic; `watched_delta` capped at 15 s.\n- `test_certificate_once`: last lesson completed twice → one certificate; `/verify/unknown` → 404 envelope.\n- v2: `test_subscription_states` (every webhook edge, grace, cancel-at-period-end), `test_quiz_gate`, `test_payout_balance`. v3: `test_pool_close` (shares sum to the pool, idempotent), `test_device_limit`. v4: manual on a phone.\n\n## 14. Environment\n`api/`: `DATABASE_URL`, `SESSION_SECRET`, `PLAYBACK_SECRET`, `WORKER_SECRET`, `WEB_URL`, `API_URL`, `REVALIDATE_SECRET`, `BLOB_READ_WRITE_TOKEN`, `GITHUB_DISPATCH_TOKEN`, `GITHUB_REPO`, `RAZORPAY_KEY_ID`, `RAZORPAY_KEY_SECRET`, `RAZORPAY_WEBHOOK_SECRET`; v2: `RESEND_API_KEY`, `RAZORPAY_PLAN_ID`. `web/`: `API_URL`, `REVALIDATE_SECRET`, `NEXT_PUBLIC_RAZORPAY_KEY_ID`, `NEXT_PUBLIC_BLOB_HOST`. **Actions secrets (worker):** `API_URL`, `WORKER_SECRET`, `BLOB_READ_WRITE_TOKEN`.\n"}, {"name": "04-ui-mockups", "path": "docs/04-ui-mockups.md", "md": "# Skillroom — UI Mockups\n\n**Lifecycle step:** 4 of 17 (UX companion to the technical design) · **Brief locked:** 2026-09-17 · **Variants:** `mockups/direction-variants.html` (six directions × six screens, eight live motion candidates), published at https://claude.ai/artifact/JK9cTzwVjD4GrEqV36WPXi · **Chosen: C · Notebook** (Viraj, 2026-09-17)\n**Pairs with:** [03-user-flows.md](03-user-flows.md) — one mockup per v1 screen (S1–S15, S19, S20) after the direction is chosen.\n**Files:** `mockups/landing.html` (exists, already ported to `web/`) → `mockups/direction-variants.html` (S3 course page + S4 player + S11 studio processing + S13 admin at desktop, S1 home + S6 my learning on a 390 px phone, six directions) → `mockups/screens.html` (every v1 screen in the chosen direction) → `mockups/tracker.html` (built by `mockups/tracker-build.py`). Photos: CC from Wikimedia Commons in `mockups/img/`, credits in `mockups/img/CREDITS.md`.\n**Published:** [Direction variants](https://claude.ai/artifact/JK9cTzwVjD4GrEqV36WPXi) · [Screens](https://claude.ai/artifact/U7Uy3zAL3dnPWmffQnk6fB) · [Tracker](https://claude.ai/artifact/AxgaJ1fZ6HELpWTZuBUXz6).\n\n## Brief\n**Style:** the landing set a first identity — **Onest**, paper `#F7F8F4`, moss `#3E6B48`, sage `#CFE0D2`, apricot `#F4B183`, 14 px radius — calm and craft-like. It is one candidate (A), not the answer. Course platforms live or die on two screens: **the course page** (does this feel worth ₹1,499?) and **the player** (does it get out of the way?) — plus one screen only this project has: **the studio's processing moment**, where a creator watches their upload become a stream. The variants must be genuinely different UI styles (layout DNA, type, surface, density), not chrome swaps of one system; the admin is the same system at a calmer density.\n\n**The product is the video.** Posters must be the biggest thing on every student screen; chrome is type and rules. The player page is dark or near-dark in every direction (video needs it); everything else is free. Studio and admin are desktop.\n\n**Real content:** the seed — six courses (wheel pottery, flatbreads, watercolour, yoga, street photography, fingerstyle guitar), six fictional Bengaluru creators with CC portraits, prices in ₹ (₹999–₹1,499, one free), 2 sections × 2 lessons each, one lesson mid-processing in the studio, a certificate for the demo student.\n\n## Motion candidates — live in the variant page\n| Candidate | What happens | Reduced-motion fallback |\n|---|---|---|\n| **1 · Develop** | In the studio, as the job runs, three rendition chips tick in (240p → 480p → 720p) and the poster **develops** from a blurred, desaturated frame to sharp (blur 24 → 0, saturate .2 → 1, 900 ms) when `ready`; the \"Preview it\" button rises under it | Chips change instantly; poster fades in |\n| **2 · Resume glide** | Opening a lesson with progress: the scrub track lights from 0 to the resume point (600 ms), the playhead glides there with a slight overshoot and a \"Resume at 4:12 · from your phone\" toast slides up; a 3-s ring counts down to auto-play | Toast only; no glide, no auto-play |\n| **3 · Curriculum draw** | On the course page, a vertical track draws down the curriculum (stroke-dashoffset, 700 ms) and each lesson row fades in as the line reaches it; completed lessons get a stroked tick | Rows appear together |\n| **4 · Certificate print** | At 100 %, the certificate card feeds out from a slot (translateY, 800 ms), then the seal stamps in (scale 1.6 → 1, rotate −6° → 0) and the student's name is stroked in | Card fades in with the seal |\n| **5 · Ladder** | The processing panel shows three horizontal bars — one per rendition — filling segment by segment (6-s chunks) as the worker reports; the bitrate labels count up | Bars set to their final width |\n| **6 · Chapter count** | Lesson numbers render as rolling counters (01 → 02) when moving to the next lesson; section headers wipe in from a rule | Numbers change instantly |\n| **7 · Spring pop** | Progress rings fill with a spring on the course card and in the sidebar when a lesson completes; the tick pops (scale .6 → 1.15 → 1) | Ring set to its value; tick appears |\n| **8 · Poster scrub** | Hovering a course card scrubs the poster through four stills (the sprite) with a thin progress hairline | Static poster |\n\nRecommendation: **1 · Develop** as the signature (it is the wow moment, and only this project has it) + **2 · Resume glide** in the player + one catalogue touch (**3** or **8**) per direction.\n\n## Variant page (`mockups/direction-variants.html`) — six directions, six screens each\nEach tab: **S3 course page** (desktop 1280, scaled) beside **S1 home** on a 390 px phone; **S4 player** (desktop) beside **S6 my learning** (phone); **S11 studio: lesson processing** (desktop) beside **S13 admin dashboard** (desktop); then a strip with the eight motion candidates live in that direction's idiom. Keys 1–6 switch tabs; every direction carries the same photos and copy.\n\n| Direction | Style (layout DNA · surface · type) | Demonstrates |\n|---|---|---|\n| **A · Workshop** | The landing's craft-school system: paper, moss, sage, apricot; Onest; 14 px radius; soft cards; poster-left / sticky buy card; sidebar player | Develop + Curriculum draw |\n| **B · Screening room** | Near-black, warm white, amber; Sora headings; full-bleed posters with gradients; browse as horizontal rails; course page as a backdrop with an episode list; the player is the page | Resume glide + Poster scrub |\n| **C · Notebook** | Ruled paper with a red margin, ink, highlighter yellow; Fraunces headings, Caveat annotations; index-card sections; curriculum as a table of contents with dotted leaders; the video sits on the page with a notes column | Curriculum draw + Certificate print |\n| **D · Blueprint** | Blueprint blue on drafting paper with a grid; Space Grotesk + JetBrains Mono; dimension lines, corner marks, dense data; the pipeline is a drawn diagram; player with segment ticks | Ladder + Chapter count |\n| **E · Journal** | Editorial magazine: off-white, black, oxblood; Instrument Serif headings at 72 px, numbered chapters, thin rules, pull quotes, generous whitespace; browse as an editorial list; player in reading mode | Chapter count + Certificate print |\n| **F · Playground** | Bright and chunky: cream, cobalt, tangerine, lime; Bricolage Grotesque; 24 px radius, 2 px borders, stickers, progress rings, streaks; bento tiles | Spring pop + Develop |\n\n`prefers-reduced-motion` respected in all.\n\n## Chosen direction — C · Notebook (locked 2026-09-17)\n**Idea:** the course is a notebook you are keeping. Ruled paper with a red margin, a Fraunces heading like a chapter title, Caveat handwriting for the things a person would write (annotations, \"continue →\", section names), photos and the video *taped* onto the page, the price on a sticky note, the curriculum as a table of contents with dotted leaders. Progress is a highlighter mark; state is a rubber stamp. The studio and admin are the same notebook at a tidier density — ledger rules, index cards, stamps for status. Nothing floats; everything is on the page.\n\n### Tokens (→ `web/src/app/globals.css`)\n| Token | Value | Use |\n|---|---|---|\n| `--paper` / `--panel` / `--tile` | `#FBF9F3` / `#FFFFFF` / `#EFEBE0` | page ground (with the rule) / cards, taped photos, index cards / image placeholders |\n| `--rule` · rule pitch | `#D9E3EC` · `28px` | `repeating-linear-gradient(transparent 0 27px, var(--rule) 27px 28px)` on the page; body line-height 28 px so text sits on the lines |\n| `--margin` | `#E0655F` | the 2 px red margin line, handwriting accents, stamps, destructive |\n| `--ink` / `--ink2` / `--muted` | `#1C2833` / `#3E4A55` / `#7A8590` | text / secondary / labels (≥ 4.5:1 on paper) |\n| `--line` | `#CBD6E0` | hairlines, dotted leaders, index-card borders |\n| `--hl` · `--sticky` | `#FFE86B` · `#FFF3A3` | highlighter (selected, current lesson, chips) · sticky notes (price, resume toast, publish checklist) |\n| `--pen` | `#2B3A8C` | blue-pen notes (student notes, annotations) |\n| `--video` | `#0E141A` | the video surface; the player page stays on paper around it |\n| radii | 0–4 px (paper), 3 px stamps, 44 px phone | nothing rounded beyond a photo corner |\n| type | **Fraunces** 600 (`opsz` 144 for h1 ≥ 44 px, 96 below) · **Onest** 400–700 body at 15–16 px / 28 px · **Caveat** 500–600 at 18–24 px for handwriting · tabular numerals for durations, prices, codes | `next/font/google`, `display: swap` |\n| grid | course page 1fr / 330 px; player 1fr / 320 px notes; studio 200 px / 1fr; phone: one column with the margin at 36 px | |\n\n### Motion (all with `prefers-reduced-motion` fallbacks)\n| Moment | Spec | Reduced |\n|---|---|---|\n| **Develop + Stamp (signature, studio S11)** | rendition chips tick 240p → 480p → 720p (each 800 ms, dot blinks while running); on `ready` the poster develops from blur 22 px / saturate .2 to sharp over 900 ms `cubic-bezier(.2,.7,.2,1)`, the red rubber stamp flips from *processing* to *ready* with a 2-frame overshoot (scale 1.4 → 1, rotate −8°), \"Preview it\" rises 10 px | chips set, poster fades in, stamp swaps text |\n| Curriculum draw (S3, S1) | the margin-side track draws down 800 ms; rows rise in with 150 ms stagger; completed ticks are stroked (dashoffset 20 → 0, 400 ms) | rows visible, ticks drawn |\n| Resume glide (S4) | scrub track lights to the resume point 600 ms, the head glides with overshoot; the toast is a **sticky note** sliding up from the controls with a 3-s countdown ring | note only, no auto-seek |\n| Certificate print (S7, S6) | the certificate feeds up out of a slot 800 ms, the seal stamps at 900 ms (`cubic-bezier(.2,1.4,.4,1)`), the name underlines with a red pen stroke | static with the seal |\n| Taped-in entrance | photos and the video enter rotated −2° → −1° / 0° with a 300 ms settle; tape strips are static | none |\n| Highlighter | selecting a tab / chip / current lesson paints a highlighter band left → right 200 ms | instant |\n| Stamps for state | published / draft / takedown / failed are stamps, rotated −8°, no animation — a state, not an event | — |\n\n### Browser surfaces\n`::selection` highlighter yellow with ink · scrollbar: paper track, ink thumb, 10 px, square · focus ring 3 px `--margin`, offset 2 px · `caret-color` pen blue · `theme-color` `#FBF9F3` · favicon = the mark with a red margin stroke.\n\n## Screens (`mockups/screens.html`)\nEvery v1 screen from the screen index in Notebook plus S20 states: S1 home (desktop + phone), S2 browse, S3 course page, S4 player (desktop + phone, resume moment), S5 buy sheet, S6 my learning (desktop + phone), S7 certificate + verify, S8 sign in / apply with the three demo cards, S9 studio courses, S10 course editor, S11 lesson + video (upload → processing → ready, and failed), S12 earnings, S13 admin dashboard, S14 admin creators, S15 admin courses + jobs, S19 creator page, S20 states (not enrolled, processing, takedown 404, empty). Published at https://claude.ai/artifact/U7Uy3zAL3dnPWmffQnk6fB. **Step 4 complete.**\n"}, {"name": "05-architecture", "path": "docs/05-architecture.md", "md": "# Skillroom — Architecture\n\n**Lifecycle step:** 5 of 17 · **Locked:** 2026-09-17\n\n## 1. System diagram\n\n```mermaid\nflowchart LR\n  subgraph Browser\n    ST[Student · phone / laptop<br/>browse · buy · player · offline v4]\n    CR[Creator studio · desktop<br/>courses · upload · earnings]\n    AD[Admin · desktop<br/>creators · courses · jobs · payouts]\n  end\n  subgraph Vercel\n    WEB[web · skillroom<br/>Next.js: catalogue (tag-cached) · player · studio · admin<br/>rewrites /api/* →]\n    API[api · skillroom-api<br/>FastAPI bom1<br/>REST · playlists · key server · webhooks · fpdf2]\n  end\n  subgraph GitHub\n    GHA[Actions runner · transcode.yml<br/>worker: ffmpeg → HLS ladder · AES-128 · poster · sprite]\n  end\n  PG[(Neon Postgres<br/>users · courses · videos + manifests · jobs<br/>enrollments · orders · ledger · progress)]\n  BL[Vercel Blob<br/>video-src · video/{prefix} (encrypted) · posters · resources · certificates]\n  RZ[Razorpay<br/>orders · subscriptions v2 · refunds]\n  RS[Resend · v2]\n\n  ST & CR & AD -->|same-origin /api/*| WEB --> API\n  CR -->|client upload · token from API| BL\n  ST -.->|Standard Checkout modal| RZ\n  API --> PG\n  API -->|repository_dispatch| GHA\n  GHA -->|claim · complete| API\n  GHA -->|GET source · PUT segments| BL\n  API -->|playlists · key| ST\n  BL -->|encrypted .ts · posters| ST\n  API -->|create order · refund| RZ\n  RZ -->|payment / subscription webhooks| API\n  API -->|revalidate tags| WEB\n  API -->|mails| RS\n```\n\n## 2. Boundaries\n| Component | Owns | Never does |\n|---|---|---|\n| **web/** | Every screen; the hls.js player and heartbeat; the upload UI (progress, polling); the Razorpay modal; the service worker and offline cache (v4) | Touch the DB, Razorpay's server API or Blob's RW token; decide entitlement; generate playlists |\n| **api/** | Auth and RBAC, catalogue, `can_watch`, playback tokens, playlists, **the key server**, progress, checkout / verify / webhooks, ledger, certificates, job dispatch and the `/internal` job routes, upload tokens, seed | Run ffmpeg; serve video bytes; hold a key in a URL |\n| **worker/** | Everything between \"source in Blob\" and \"manifest reported\": probe, ladder, encryption, poster, sprite, upload | Touch the DB (it only talks to `/internal/*`); decide anything about entitlement |\n| **Postgres** | Everything durable, including manifests and per-video keys | Store video bytes |\n| **Blob** | Bytes: sources, encrypted segments, posters, sprites, resources, PDFs | Decide who may read (segments are ciphertext; access is the key endpoint) |\n| **GitHub Actions** | Free compute for the worker | Anything the worker script does not already do locally |\n| **Razorpay** | Taking the money and telling us via webhook | Deciding enrollment — `mark_paid` is ours |\n\nContract: `api/openapi.json` → `web/src/lib/api-types.ts` via `pnpm gen:api`. Web client (`web/src/lib/api.ts`) = typed `fetch` forwarding cookies, trusting only the `{ error: { code, message, details } }` envelope.\n\n## 3. api/ layout\n```\napi/app/\n  main.py            app factory, request-id middleware, error envelope\n  config.py          pydantic-settings\n  db.py              async engine\n  models/            user, session, creator_profile, course, section, lesson, video, video_job, resource,\n                     enrollment, progress, certificate, order, ledger_entry, webhook_event,\n                     subscription · quiz · question · attempt · payout (v2), watch_minute · watch_bucket · playback_session · pool_close (v3), offline_lease (v4)\n  schemas/           pydantic request/response models (= the OpenAPI contract)\n  routers/           auth, catalog (home, courses, creators), lessons (play, progress, complete), stream (master, media, key),\n                     checkout, me, creator (courses, sections, lessons, video, resources, earnings), admin, internal (jobs), webhooks,\n                     subscriptions (v2), quizzes (v2), payouts (v2), pool (v3), offline (v4)\n  services/\n    entitlement.py   can_watch(), active_subscription()\n    playback.py      sign_token(), verify_token(), master_playlist(), media_playlist()\n    jobs.py          enqueue(), dispatch() (GitHub), claim(), complete(), fail(), stale()\n    blob.py          put / head / delete via REST; client_upload_token()\n    checkout.py      create order, mark_paid, expire_stale\n    ledger.py        post(), balance(), available()\n    razorpay.py      order create, signature verify, webhook verify, refund, subscriptions (v2)\n    progress.py      heartbeat(), resume_at(), maybe_complete_course()\n    certificates.py  issue() (fpdf2) · verify()\n    pool.py          close_month() (v3)\n  worker/\n    transcode.py     the worker CLI (claim → probe → ffmpeg → upload → complete)\n    ffmpeg.py        command builders, playlist parsing\n  assets/            Onest-*.ttf (certificates), colour-bars.mp4 (test fixture)\n  seed/              catalog.json · fetch_videos.py · videos/ (+ CREDITS.md) · seed.py (users, courses, jobs → worker --poll → enrollments, progress)\nscripts/             create_plan.py (v2) · gc_blob.py · eval_stream.py\ntests/               the tests listed in 04 §13 only\n.github/workflows/   ci.yml · transcode.yml (the worker)\n```\n\n## 4. web/ layout\n```\nweb/src/\n  app/(site)/            page.tsx (home) · courses · c/[slug] · u/[handle] · verify/[code] · all-access (v2)\n  app/(learn)/           learn/[slug]/[lesson] · learn/[slug]/quiz/[id] (v2) · me · certificates/[code]\n  app/(auth)/            sign-in · sign-up · apply\n  app/(studio)/studio/   layout (404 non-creators) · page · courses/new · courses/[id] · courses/[id]/lessons/[lid] · earnings · courses/[id]/analytics (v3)\n  app/(admin)/admin/     layout (404 non-admins) · page · creators · courses · jobs · payouts (v2)\n  app/api/revalidate/    route.ts\n  components/site/       CourseCard · CourseGrid · CategoryChips · Curriculum · CreatorCard · BuySheet · RazorpayButton\n  components/player/     Player · Controls · ResumeToast · Curriculum (sidebar) · ScrubPreview (v2) · DownloadButton (v4)\n  components/studio/     CourseForm · SectionList · LessonRow · VideoPanel (upload + job status) · ResourceList · EarningsTable · QuizEditor (v2)\n  components/admin/      Applications · CourseTable · JobsBoard · PayoutQueue (v2)\n  components/landing/    (exists)\n  components/ui/\n  lib/api.ts · api-types.ts (generated) · session.ts · hls.ts (player setup) · heartbeat.ts · upload.ts · money.ts · offline.ts (v4)\n  public/manifest.webmanifest · sw.js (v4)\n```\n\n## 5. Deployment topology\n- Two Vercel projects per repo: `skillroom` (root `web/`) and `skillroom-api` (root `api/`, FastAPI preset, `bom1`). `web/next.config.ts` rewrites `/api/:path*` → `API_URL`; cookies are first-party; no CORS. Blob's own CORS (`*`) covers segment fetches from the Blob host.\n- Neon: one project; `main` = production, a `dev` branch for local; CI uses the `postgres:17` image.\n- Blob store on `skillroom-api`; `NEXT_PUBLIC_BLOB_HOST` in `remotePatterns`.\n- GitHub: `transcode.yml` on `repository_dispatch` with the three worker secrets; a fine-grained token for the API to dispatch. The repo is public → unlimited Actions minutes.\n- Razorpay test mode; webhook → `https://skillroom.virajdomadia.com/api/webhooks/razorpay` (via the web rewrite so the URL survives an API host change).\n- Previews: Vercel previews per PR for `web/` against the production API.\n- CI: `web` = pnpm typecheck + build; `api` = ruff + pytest (ubuntu runner has ffmpeg, so `test_worker` runs). That is all.\n\n## 6. Request paths worth drawing\n**Upload:** creator drops `lesson-3.mp4` (180 MB) → `/api/creator/lessons/42/video/token` → client token → multipart PUT to Blob (progress bar) → `POST /api/creator/lessons/42/video` → `videos` (key generated) + `video_jobs(queued)` → `repository_dispatch` → runner claims in ~20 s → ffmpeg ≈ 80 s → 3 × ~20 segments + poster + sprite to Blob → `complete` → `ready`; the studio's poll flips the status and the poster develops.\n**Play:** `/learn/wheel-pottery/centering` → `POST /api/lessons/42/play` → `can_watch` → token → `master.m3u8?t` → `480p.m3u8?t` → `key?t` (403 for the wrong person) → segments from the Blob CDN → hls.js decrypts and climbs to 720p; heartbeats every 10 s.\n**Buy:** `/c/wheel-pottery` → Buy → `POST /api/checkout` → modal → `POST /api/checkout/{id}/verify` → `mark_paid` → enrollment + ledger → the course page shows Start; the webhook arrives seconds later → no-op.\n**Certificate:** last lesson's heartbeat crosses 90 % → `maybe_complete_course` → `issue()` → fpdf2 → Blob → `/me` shows the certificate; `/verify/SR-7Q2M-K9XD` is public.\n**Offline (v4):** Download → 480p playlist + segments into Cache Storage, key + 48-h lease into IDB → airplane mode → custom loader serves from cache → progress queues → back online → flush + lease refresh.\n\n## 7. Security notes (the short list)\nCookie session HttpOnly + SameSite=Lax; argon2 passwords; studio and admin 404 for the wrong role and creators are scoped to their own rows; **the key endpoint re-checks entitlement on every call** and never caches; playback tokens are HMAC-signed, bound to user + lesson + device, 1-h expiry; per-video keys li
