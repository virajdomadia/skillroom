ve only in Postgres and in the worker's temp dir for the duration of a job; segments are AES-128 ciphertext on a public CDN under a random prefix; upload tokens are scoped to one pathname, one content-type set, 500 MB, 1 h; `/internal/*` needs the worker secret; Razorpay signatures checked on verify and webhooks, event ids deduped; prices come from the DB, never the client; certificate codes are random base32; `/verify` is rate-limited 30/min/IP; no PII in logs; the GC and eval scripts never run against production without `--yes`.\n"}, {"name": "06-data-and-api", "path": "docs/06-data-and-api.md", "md": "# Skillroom — Database + API Design\n\n**Lifecycle step:** 6 of 17 · **Locked:** 2026-09-17 · Behaviour in [04-technical-design.md](04-technical-design.md). Alembic `0001_v1` creates everything under **A**; v2 / v3 / v4 tables get their own migrations.\n\n## A. Postgres schema (v1)\n\n```sql\ncreate type user_role       as enum ('student','creator','admin');\ncreate type creator_status  as enum ('applied','approved','rejected');\ncreate type course_status   as enum ('draft','published','takedown');\ncreate type category        as enum ('pottery','baking','art','yoga','photography','music');\ncreate type video_status    as enum ('none','queued','processing','ready','failed');\ncreate type job_state       as enum ('queued','processing','ready','failed');\ncreate type enrol_source    as enum ('purchase','free','subscription','admin');\ncreate type order_state     as enum ('pending_payment','paid','failed','expired','refunded');\ncreate type ledger_kind     as enum ('sale','fee','refund','payout','pool_share');\n\nusers            (id uuid pk, email citext unique, password_hash text, name text, role user_role default 'student', created_at)\nsessions         (id text pk, user_id uuid fk, expires_at timestamptz, created_at)                        index (user_id)\ncreator_profiles (user_id uuid pk fk, handle citext unique, display_name text, area text, bio text, subject text,\n                  avatar_url text null, status creator_status default 'applied', note text null, payout_note text null,\n                  applied_at, decided_at null, decided_by uuid fk null)\n\ncourses          (id uuid pk, creator_id uuid fk, slug citext unique, title text, subtitle text, category category, level text,\n                  price_paise int check (price_paise >= 0), description text, cover_url text null,\n                  status course_status default 'draft', takedown_note text null, published_at null, created_at, updated_at)\n                  index (creator_id) · index (status, category)\nsections         (id uuid pk, course_id fk, title text, sort int)                                          index (course_id, sort)\nlessons          (id uuid pk, section_id fk, course_id fk, title text, sort int, is_preview bool default false,\n                  duration_s int null, created_at)                                                        index (section_id, sort) · index (course_id)\nvideos           (id uuid pk, lesson_id uuid fk unique, source_url text, source_bytes bigint, prefix text unique,\n                  key_hex char(32), iv_hex char(32), status video_status default 'queued',\n                  manifest jsonb null, poster_url text null, sprite_url text null, duration_s int null, created_at, ready_at null)\nvideo_jobs       (id uuid pk, video_id fk, state job_state default 'queued', attempts int default 0, error text null,\n                  dispatch_error text null, claimed_at null, finished_at null, created_at)                  index (state, created_at)\nresources        (id uuid pk, lesson_id fk, name text, url text, bytes int, created_at)                    index (lesson_id)\n\nenrollments      (id uuid pk, user_id fk, course_id fk, source enrol_source, order_id uuid fk null, created_at)\n                  unique (user_id, course_id) · index (course_id)\nprogress         (user_id fk, lesson_id fk, course_id fk, position_s int default 0, watched_s int default 0,\n                  completed bool default false, completed_at null, updated_at, primary key (user_id, lesson_id))  index (user_id, course_id)\ncertificates     (id uuid pk, code text unique, user_id fk, course_id fk, pdf_url text, issued_at)         unique (user_id, course_id)\n\norders           (id uuid pk, number text unique,                      -- 'SR-1042', sequence-backed\n                  user_id fk, course_id fk, amount_paise int, state order_state,\n                  razorpay_order_id text unique, razorpay_payment_id text null, refund_id text null,\n                  created_at, paid_at null, updated_at)                                                     index (user_id, created_at desc) · index (state, created_at)\nledger_entries   (id uuid pk, account text,                            -- 'platform' | 'creator:{user_id}'\n                  kind ledger_kind, amount_paise int,                  -- signed\n                  order_id fk null, payout_id uuid null, period char(7) null, note text null, created_at)  index (account, created_at)\nwebhook_events   (id text pk, event text, received_at)\n```\n\n`videos.key_hex` never leaves the API except to the worker's claim response and the key endpoint's 16-byte body. `videos.manifest` is the worker's report (renditions with segment durations, sprite geometry) — playlists are generated from it on every request, never stored. `progress.completed` is monotonic (the upsert uses `completed or excluded.completed`). `orders.amount_paise` is a snapshot of the price at checkout. `ledger_entries` is append-only; balances are sums.\n\n**mark_paid recipe** (verify and webhook share it):\n```sql\nbegin;\n  select * from orders where id = $1 for update;                                  -- if state <> 'pending_payment' → commit, no-op\n  update orders set state = 'paid', razorpay_payment_id = $2, paid_at = now() where id = $1;\n  insert into enrollments (user_id, course_id, source, order_id) values ($u, $c, 'purchase', $1) on conflict do nothing;\n  insert into ledger_entries (account, kind, amount_paise, order_id) values ('creator:'||$creator, 'sale', round($amt * 0.8), $1),\n                                                                            ('platform', 'fee', $amt - round($amt * 0.8), $1);\ncommit;\n```\n\n**Heartbeat recipe:**\n```sql\ninsert into progress (user_id, lesson_id, course_id, position_s, watched_s, completed, completed_at, updated_at)\nvalues ($u, $l, $c, $pos, least($delta, 15), $pos >= 0.9 * $dur, case when $pos >= 0.9 * $dur then now() end, now())\non conflict (user_id, lesson_id) do update set\n  position_s = excluded.position_s, watched_s = progress.watched_s + excluded.watched_s,\n  completed = progress.completed or excluded.completed,\n  completed_at = coalesce(progress.completed_at, excluded.completed_at), updated_at = now();\n-- then: if every ready lesson of the course is completed and no certificate exists → issue()\n```\n\n**v2 additions:** `subscriptions (id, user_id fk, razorpay_subscription_id text unique, plan_id text, state text, current_end timestamptz null, cancel_at_period_end bool, created_at, updated_at)` index (user_id); `quizzes (id, section_id fk unique, pass_pct int)`; `questions (id, quiz_id fk, text, options jsonb, correct int, sort)`; `attempts (id, user_id fk, quiz_id fk, answers jsonb, score_pct int, passed bool, created_at)` index (user_id, quiz_id); `payouts (id, creator_id fk, amount_paise int, state text requested|paid|rejected, reference text null, note text null, requested_at, decided_at null, decided_by fk null)`; `captions (lesson_id pk fk, url, lang)`; `email_log (id, user_id fk, kind, sent_at)`; `users.reset_token`, `reset_expires_at`.\n**v3 additions:** `watch_minutes (month char(7), creator_id fk, course_id fk, user_id fk, source enrol_source, seconds int, primary key (month, course_id, user_id))`; `watch_buckets (lesson_id fk, bucket int, viewers int, primary key (lesson_id, bucket))`; `playback_sessions (user_id fk, lesson_id fk, device_id text, last_seen timestamptz, primary key (user_id, lesson_id, device_id))`; `pool_closes (month char(7) pk, pool_paise int, total_seconds bigint, lines jsonb, closed_at, closed_by fk)`; `courses.search tsvector` generated (title A, subtitle B, description C) + GIN.\n**v4 additions:** `offline_leases (id uuid pk, user_id fk, lesson_id fk, device_id text, expires_at timestamptz, revoked bool default false, created_at)` unique (user_id, lesson_id, device_id).\n\n## B. Blob keys\n| Prefix | Written by | Deleted when |\n|---|---|---|\n| `video-src/{lesson_id}/{uuid}.{ext}` | Creator's browser (client token from the API) | Job `ready` (source no longer needed) or orphan GC |\n| `video/{prefix}/{rendition}_{nnn}.ts` · `poster.jpg` · `sprite.jpg` | Worker | Video replaced (after the new one is `ready`) or lesson deleted |\n| `resources/{lesson_id}/{uuid}.{ext}` | Creator's browser (client token) | Resource removed |\n| `captions/{lesson_id}/{lang}.vtt` (v2) | Creator's browser | Replaced |\n| `certificates/{code}.pdf` | API (`issue()`) | Never |\n| `avatars/{user_id}.jpg` | Seed / creator profile | Replaced |\n\n## C. REST API (`/api/*` from the browser; FastAPI serves `/docs`)\n\nError envelope everywhere: `{ \"error\": { \"code\": \"not_entitled\", \"message\": \"…\", \"details\": {…} } }`. Auth via cookie; `🔒` = signed in, `🎓` = creator (404 otherwise, and only own courses), `👑` = admin (404 otherwise), `⚙` = worker secret / server-to-server, `🎟` = playback token in `?t=`. Money fields are paise integers.\n\n### Auth\n| Method | Path | Body → Returns |\n|---|---|---|\n| POST | `/auth/sign-up` | `{ email, password, name }` → `Me` |\n| POST | `/auth/sign-in` | `{ email, password }` → `Me` |\n| POST | `/auth/sign-out` | → 204 |\n| GET | `/auth/me` | `Me { id, name, email, role, creator_status? }` · 401 |\n| POST | `/auth/demo` | `{ as: 'student' \\| 'creator' \\| 'admin' }` → `Me` |\n| POST 🔒 | `/apply` | `{ display_name, handle, area, bio, subject }` → `CreatorProfile` · 409 `already_applied` |\n\n### Catalogue (public)\n| Method | Path | Returns |\n|---|---|---|\n| GET | `/home` | `{ new_courses: CourseCard[], free_to_start: LessonCard[], categories: {key, count, cover}[], creators: CreatorCard[], continue_watching?: ContinueCard[] (v2, 🔒) }` · `s-maxage=300` |\n| GET | `/courses?category=&q= (v3)&page=` | `Page<CourseCard>` — published with ≥ 1 ready lesson |\n| GET | `/courses/{slug}` | `Course` (sections → lessons with duration, `is_preview`, and — signed in — `completed`, `enrolled`, `progress_pct`, `certificate_code?`) · 404 if draft / takedown |\n| GET | `/creators/{handle}` | `CreatorPage { profile, courses: CourseCard[] }` |\n| GET | `/verify/{code}` | `{ name, course_title, creator_name, issued_at }` · 404 (rate-limited 30/min/IP) |\n\n### Learning 🔒\n| Method | Path | Body → Returns |\n|---|---|---|\n| POST | `/lessons/{id}/play` | `{ device_id }` → `Play { master_url, poster_url, resume_at, duration_s, sprite?: SpriteMeta (v2), captions?: [] (v2) }` · 403 `not_entitled` · 409 `video_not_ready` |\n| POST | `/lessons/{id}/progress` | `{ position_s, watched_delta_s, client_ts }` → `{ completed, course_progress_pct, certificate_code? }` (also accepts a `text/plain` JSON body for `sendBeacon`) |\n| POST | `/lessons/{id}/complete` | → same as progress |\n| POST | `/courses/{id}/enrol` | → `Enrollment` — free courses only · 422 `not_free` · 409 `already_enrolled` |\n| GET | `/me` | `MePage { courses: [{ course: CourseCard, progress_pct, continue_lesson: {id, title, resume_at} }], certificates: CertificateCard[], subscription?: Subscription (v2), downloads?: [] (v4) }` |\n| GET | `/certificates/{code}` | `Certificate { code, course, name, issued_at, pdf_url }` — owner only |\n\n### Streaming 🎟\n| Method | Path | Returns |\n|---|---|---|\n| GET | `/stream/{lesson_id}/master.m3u8?t=` | `application/vnd.apple.mpegurl` · 401 `bad_token` |\n| GET | `/stream/{lesson_id}/{rendition}.m3u8?t=` | media playlist with `EXT-X-KEY` and absolute Blob segment URLs |\n| GET | `/stream/{lesson_id}/key?t=` | 16 bytes `application/octet-stream`, `private, no-store` · 401 `bad_token` · 403 `not_entitled` · 403 `too_many_devices` (v3) |\n\n### Checkout\n| Method | Path | Body → Returns |\n|---|---|---|\n| POST 🔒 | `/checkout` | `{ course_id }` → `{ order_id, number, razorpay_order_id, key_id, amount_paise }` · 409 `already_enrolled` · 422 `free_course` |\n| POST 🔒 | `/checkout/{order_id}/verify` | `{ razorpay_payment_id, razorpay_signature }` → `Order` · 400 `bad_signature` |\n| GET 🔒 | `/orders` | `OrderCard[]` |\n\n### Creator studio 🎓\n| Method | Path | Body → Returns |\n|---|---|---|\n| GET | `/creator/courses` | `StudioCourseRow[]` (cover, title, status, lessons_ready, lessons_total, enrollments, revenue_paise) |\n| POST | `/creator/courses` | `{ title, subtitle, category, level, price_paise, description }` → `StudioCourse` (slug generated) |\n| GET/PATCH | `/creator/courses/{id}` | `StudioCourse` (sections → lessons with `video: { status, poster_url, duration_s, error? }`, `publish_checklist`) |\n| POST | `/creator/courses/{id}/publish` · `/unpublish` | → `StudioCourse` · 409 `not_publishable { reasons }` |\n| POST/PATCH/DELETE | `/creator/courses/{id}/sections` · `/sections/{sid}` | `{ title, sort }` |\n| POST/PATCH/DELETE | `/creator/sections/{sid}/lessons` · `/creator/lessons/{lid}` | `{ title, sort, is_preview }` |\n| POST | `/creator/lessons/{lid}/video/token` | `{ type: 'blob.generate-client-token', payload }` → `{ type, clientToken }` (the `@vercel/blob/client` protocol) |\n| POST | `/creator/lessons/{lid}/video` | `{ url, size }` → `VideoStatus` — records the source, generates key + prefix, enqueues, dispatches · 422 `bad_source` |\n| GET | `/creator/lessons/{lid}/video` | `VideoStatus { status, job: { state, attempts, error?, claimed_at? }, renditions_done: string[], poster_url?, duration_s? }` (polled) |\n| POST | `/creator/lessons/{lid}/video/retry` ecret }` — on publish / takedown / video ready / profile change |\n\n### v2\n| Method | Path | Notes |\n|---|---|---|\n| POST 🔒 | `/subscriptions` | → `{ razorpay_subscription_id, key_id }` · 409 `already_subscribed` |\n| POST 🔒 | `/subscriptions/cancel` | → `Subscription` (cancel-at-period-end) |\n| GET 🔒 | `/quizzes/{id}` · POST `/quizzes/{id}/attempts` | questions without `correct`; `{ answers: int[] }` → `Attempt { score_pct, passed, correct: int[] }` |\n| 🎓 | `/creator/sections/{sid}/quiz` (PUT) · `/creator/lessons/{lid}/captions/token` · `/captions` | quiz editor; captions upload |\n| POST 🎓 | `/creator/payouts` | `{ amount_paise }` → `Payout` · 422 `insufficient` / `open_request` |\n| 👑 | `GET /admin/payouts` · `POST /admin/payouts/{id}/pay { reference }` · `/reject { note }` | |\n| POST | `/auth/forgot` · `/auth/reset` | Resend link |\n\n### v3\n`POST 👑 /admin/pool/close { month }` → `PoolClose` · 409 `already_closed` · `GET 🎓 /creator/courses/{id}/analytics` → `{ lessons: [{ id, title, starters, completion_pct, curve: number[] (per 10-s bucket, ratio of starters), dropoffs: [{ at_s, fall_pct }] }] }` · `GET /courses?q=` full-text · key endpoint device limit (`403 too_many_devices { limit: 2 }`).\n\n### v4\n`POST 🔒 /lessons/{id}/offline-lease { device_id }` → `{ key_hex, iv_hex, expires_at, rendition: '480p', playlist: string, segments: string[] }` (requires `can_watch`; refreshes an existing lease) · `DELETE /lessons/{id}/offline-lease` · `/manifest.webmanifest` · `/sw.js` (web only).\n\n## D. Payload shapes that matter\n```ts\ntype CourseCard = { id: string; slug: string; title: string; subtitle: string; category: Category; level: string; price_paise: number;\n                    cover: { url: string; width: number; height: number } | null; creator: { handle: string; display_name: string; avatar_url?: string };\n                    lessons: number; duration_s: number; enrolled?: boolean; progress_pct?: number };\ntype Course = CourseCard & { description: string; status: 'published';\n                    sections: { id: string; title: string; lessons: { id: string; title: string; duration_s: number; is_preview: boolean; completed?: boolean; ready: boolean }[]; quiz?: { id: string; passed?: boolean } }[];\n                    certificate_code?: string };\ntype Play = { master_url: string; poster_url: string; resume_at: number; duration_s: number; sprite?: SpriteMeta; captions?: { lang: string; url: string }[] };\ntype SpriteMeta = { url: string; cols: number; rows: number; w: number; h: number; interval_s: number };\ntype VideoStatus = { status: 'none'|'queued'|'processing'|'ready'|'failed'; job?: { state: string; attempts: number; error?: string; claimed_at?: string; dispatch_error?: string };\n                     renditions_done: string[]; poster_url?: string; duration_s?: number; source_bytes?: number };\ntype Manifest = { duration_s: number; width: number; height: number; iv_hex: string;\n                  renditions: { name: '240p'|'480p'|'720p'; bandwidth: number; width: number; height: number; codecs: string; segments: number[] }[];\n                  poster_url: string; sprite: SpriteMeta };\ntype CheckoutStart = { order_id: string; number: string; razorpay_order_id: string; key_id: string; amount_paise: number };\ntype Earnings = { balance_paise: number; available_paise: number; pending_paise: number; paid_paise: number;\n                  entries: { kind: LedgerKind; amount_paise: number; note?: string; order_number?: string; period?: string; at: string }[];\n                  payouts?: Payout[]; pool?: { month: string; pool_paise: number; my_seconds: number; total_seconds: number; share_pct: number; amount_paise: number }[] };\ntype Me = { id: string; name: string; email: string; role: 'student'|'creator'|'admin'; creator_status?: 'applied'|'approved'|'rejected' };\n```\n"}, {"name": "07-plan", "path": "docs/07-plan.md", "md": "# Skillroom — Development Plan\n\n**Lifecycle step:** 7 of 17 · **Written:** 2026-09-17 · **Inputs:** [03-requirements.md](03-requirements.md), [04-technical-design.md](04-technical-design.md), [06-data-and-api.md](06-data-and-api.md).\n**Tracker:** row status lives at https://claude.ai/artifact/AxgaJ1fZ6HELpWTZuBUXz6 (updated per milestone; rebuild the page with `python mockups/tracker-build.py`).\n**Budget:** v1 ≈ 16 h · v2 ≈ 11 h · v3 ≈ 8 h · v4 ≈ 3 h. v1 runs the whole video pipeline and the key server from milestone 1.0, so v2 and v3 add money shapes and telemetry, and v4 adds a surface — never a second engine. **Cadence:** evenings/weekends; each row = one branch + one PR, squash-merged, and **every PR shows something in the browser**. Milestones end deployed. **Build starts after Offcut** (order 1 → 2 → 4 → 5 → 3 → 6).\n\n**Lean rules in force** (2026-09-15): setup is the minimum to deploy both apps with plain CI; no observability, contract gates, e2e workflows or tracker updates per PR; review findings fixed on the same branch; tests only from 04 §13. Hours saved go to the player, the studio's processing moment and the seed videos. **Accounts and keys are created just-in-time** — in the row that first needs them, never in a setup batch: **Neon in S2; Vercel Blob, the GitHub fine-grained dispatch token and the three Actions secrets in S3; Razorpay in F3; Resend in L4.** Videos are CC from Wikimedia Commons, fetched by script in S3.\n\nHow the lifecycle maps: step 8 = milestone 1.0; steps 9–11 and 14–15 cycle inside every row; step 12 is one checklist row at the end of v1; step 13 is the CI file in 1.0; step 16 is skipped unless something breaks; step 17 is a short doc after v3.\n\nColumn key — **Who:** 🟢 student · 🟠 creator · 🟣 admin · ⚪ platform / worker. Endpoints from 06 §C; screens from 03-user-flows.\n\n---\n\n## v1 — Classroom (≈ 16 h)\n\n### Milestone 1.0 — Skeleton + the pipeline live (≈ 6 h) — step 8\nGoal: both apps deployed, the worker transcoding on Actions, every seeded lesson `ready` and playable through the key server, direction chosen.\n\n| # | Part | Who | web/ | api/ | Est. | Done when |\n|---|---|---|---|---|---|---|\n| S1 | **Direction + tokens** | 🟢 | Variant page per [04-ui-mockups.md](04-ui-mockups.md) (six directions × six screens, live motion candidates, CC photos) → Viraj picks → tokens + fonts in `globals.css`, themed browser surfaces | — | 1.5 h | Chosen direction recorded in 04-ui-mockups; landing restyled only if tokens changed |\n| S2 | **API skeleton + DB + auth + catalogue seed** | ⚪ | `next.config.ts` rewrite `/api/*`; `lib/api.ts` typed fetch; `pnpm gen:api` | `pyproject` (uv), `main.py`, settings, error envelope, `/health`; models + Alembic `0001_v1` (06 §A); `/auth/*` (argon2, sessions, `sr_session`, `/auth/demo`, roles, `require_*`); `seed/catalog.json` — 6 creators, 6 courses, 12 sections, 24 lessons (no video yet), ~10 students; `seed.py` (idempotent); `GET /home`, `/courses`, `/courses/{slug}`, `/creators/{handle}`; **accounts needed here and no others:** Vercel project `skillroom-api` (FastAPI preset, bom1) + Neon (`DATABASE_URL`); `ci.yml` (web typecheck + build · api ruff + pytest with `postgres:17`); **test:** `rbac` | 2 h | `api.skillroom…/docs` opens in prod; `GET /courses` lists six courses with curricula; a student hitting `/admin/*` gets 404; seed runs twice cleanly; CI green |\n| S3 | **The video pipeline: worker + Actions + stream + video seed** | ⚪ | — | `worker/transcode.py` + `worker/ffmpeg.py` (claim → probe → ladder + AES-128 → poster + sprite → Blob → complete), `services/jobs.py` (enqueue, GitHub dispatch, claim, complete, fail, stale), `services/blob.py`, `services/playback.py` (token sign / verify, master + media playlists), `services/entitlement.py::can_watch`, `routers/internal.py`, `routers/stream.py`, `POST /lessons/{id}/play`; `.github/workflows/transcode.yml`; `seed/fetch_videos.py` (Commons API, `video/webm`, licence filter, backoff, `CREDITS.md`) → `seed/videos/` sliced to 90–150 s by ffmpeg; `seed.py videos` enqueues 24 jobs and is refused; after 5 min idle it plays |\n| A4 | **Course search + v3 close** | S2 search box (URL `q`), results with the matched field hinted | `courses.search` tsvector + GIN; `/courses?q=`; `docs/17-post-launch.md` (½ page); case study | 1.5 h | \"naan\" finds the flatbreads course by description alone; v3 tagged; case study live |\n\n**v3 total ≈ 8 h**\n\n---\n\n## v4 — Offline lessons (≈ 3 h) — the unique free feature 🟢\n\n### Milestone 4.0 — Offline (≈ 3 h)\nSame core, a new place: the lesson leaves the network. ₹0 per use (Viraj, 2026-09-17).\n\n| # | Part | web/ | api/ | Est. | Done when |\n|---|---|---|---|---|---|\n| U1 | **PWA + download + offline playback** | `manifest.webmanifest` (name, icons from `brand/`, `display: standalone`), hand-written `sw.js` (app shell precache, network-first pages); `DownloadButton` on S4: fetch the 480p playlist through the API + every segment into `caches.open('offline-{lesson}')`, lease into IndexedDB (`idb-keyval`); `lib/offline.ts` — hls.js custom loader serving playlist / segments / key from cache, refusing on an expired lease; `/me` downloads list with sizes + Remove | `offline_leases`; `POST /lessons/{id}/offline-lease` (requires `can_watch`, 48 h, refresh), `DELETE`; leases revoked on refund / takedown | 2 h | On an Android phone in airplane mode a downloaded lesson plays from the first tap; an expired lease refuses with \"Reconnect to renew\"; a refunded student's next refresh fails and the download is removed |\n| U2 | **Install + sync + v4 close** | Install prompt on the player (`beforeinstallprompt`, dismissible, remembered); offline progress queue in IDB flushed on `online`; \"Take it offline\" card on S4 with the how-to; README section \"the lesson in your pocket\"; `docs/17-post-launch.md` (½ page); case study | — | 1 h | Progress made offline shows on the laptop after reconnecting; reviewer installs from the player in one tap; v4 tagged; case study live |\n\n**v4 total ≈ 3 h** · **Project total ≈ 38 h**\n\n---\n\n## Whole-product summary\n| Version | Milestones | Hours | Cumulative |\n|---|---|---|---|\n| v1 Classroom | 1.0 – 1.2 | 16 | 16 |\n| v2 All-access | 2.0 – 2.1 | 11 | 27 |\n| v3 Royalties | 3.0 | 8 | 35 |\n| v4 Offline lessons | 4.0 | 3 | 38 |\n| Add-ons (in priority order) | A Q&A (3) · B coupons (2) · C drip (2) · D Route transfers (3) · E ratings (2) · F podcast feed (3) · G embeddable preview (2) · H notes & bookmarks (2) · I co-instructors (2) | up to 21 | up to 59 |\n\n## Add-ons (only from time saved)\n**Nice-to-have, not priority** (Viraj, 2026-09-17): considered only after v4 is fully done (docs and case study included), in this order, from time saved — and skipping all of them is a fine outcome. None is a version; none changes the engine. All free to run.\n\n| # | Add-on | What | Version it extends | ~h |\n|---|---|---|---|---|\n| A | **Q&A per lesson** | Threaded questions under the player with creator answers pinned; creator inbox in the studio | v1 | 3 |\n| B | **Coupons** | `coupons(code, percent, max_uses, expires_at)` applied on the buy sheet; Razorpay amount reflects it | v1 | 2 |\n| C | **Drip scheduling** | Sections unlock N days after enrollment; the curriculum shows \"unlocks in 3 days\" | v1 | 2 |\n| D | **Razorpay Route transfers** | `PayoutProvider` protocol; `RouteProvider` creates a linked account per creator and a transfer per payout; the ledger stays the source of truth (needs Route enabled + KYC for live) | v2 | 3 |\n| E | **Ratings & reviews** | 1–5 stars + a line, only from students ≥ 50 % through; average on the card | v1 | 2 |\n| F | **Private podcast feed** | The worker adds an audio-only rendition; each enrolled student gets a tokenised RSS URL for podcast apps | v1 | 3 |\n| G | **Embeddable preview player** | `/embed/[slug]` iframe + oEmbed for the preview lesson; enrol links back | v1 | 2 |\n| H | **Notes & bookmarks** | Timestamped notes on the player, listed per course, exported as Markdown | v1 | 2 |\n| I | **Co-instructors** | A second creator on a course with a revenue split percentage in the ledger | v2 | 2 |\n"}], "links": {"variants": "https://claude.ai/artifact/JK9cTzwVjD4GrEqV36WPXi", "screens": "https://claude.ai/artifact/U7Uy3zAL3dnPWmffQnk6fB", "landing": "https://skillroom-viraj.vercel.app", "repo": "https://github.com/virajdomadia/skillroom"}}</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const rows = D.rows, docs = D.docs, L = D.links;
  const status = {};
  let db = null, canWrite = true;

  const planEl = document.getElementById('plan');
  function renderPlan(){
    const byVer = {}; rows.forEach(r=>{ (byVer[r.version] ||= []).push(r); });
    planEl.innerHTML = '';
    for(const [ver, rs] of Object.entries(byVer)){
      const done = rs.filter(r=>status[r.id]?.status==='done').length;
      const hours = rs.reduce((a,r)=>a+parseFloat(r.est||0),0);
      const sec = document.createElement('div'); sec.className='ver';
      sec.innerHTML = `<h2>${ver} <small>${rs.length} rows · ≈ ${hours} h · ${done} done</small></h2><div class="bar" style="--p:${rs.length?done/rs.length*100:0}%"></div>`;
      let ms = '';
      rs.forEach(r=>{
        if(r.milestone!==ms){ ms=r.milestone; const h=document.createElement('div'); h.className='ms'; h.textContent=ms; sec.appendChild(h); }
        const s = status[r.id]?.status || 'todo';
        const el = document.createElement('div'); el.className='rw'+(s==='done'?' done-row':'');
        el.innerHTML = `<span class="id">${r.id}</span><div><div class="part">${r.part}</div><div class="done">${r.done}</div></div><span class="est">${r.est||''}</span><button class="st" data-s="${s}" data-id="${r.id}" ${canWrite?'':'disabled'}>${s}</button>`;
        sec.appendChild(el);
      });
      planEl.appendChild(sec);
    }
    const total = rows.length, done = rows.filter(r=>status[r.id]?.status==='done').length;
    document.getElementById('st-done').textContent = done; document.getElementById('st-total').textContent = total;
    document.getElementById('st-hours').textContent = Math.round(rows.reduce((a,r)=>a+parseFloat(r.est||0),0)) + ' h';
  }
  planEl.addEventListener('click', async e=>{
    const b = e.target.closest('.st'); if(!b || !db || !canWrite) return;
    const id = b.dataset.id, next = {todo:'doing', doing:'done', done:'todo'}[b.dataset.s];
    b.disabled = true;
    try{ await db.doc('rows/'+id).set({status: next, updated: new Date().toISOString()}); }
    catch(err){ if(err && (err.code==='not_granted' || err.code==='permission_denied')){ canWrite=false; document.getElementById('plan-note').textContent='Read-only for you — status can only be changed by editors.'; } }
    b.disabled = false;
  });
  renderPlan();
  (async()=>{
    db = await claude.use('db');
    if(!db){ document.getElementById('plan-note').textContent = 'Status is not available in this view.'; canWrite=false; renderPlan(); return; }
    const user = await claude.use('user'); const cw = user ? await user.can('data.write') : null; if(cw===false){ canWrite=false; document.getElementById('plan-note').textContent='Read-only for you — status can only be changed by editors.'; }
    db.collection('rows').onSnapshot(snap=>{ snap.docs.forEach(d=>{ if(d.exists) status[d.id]=d.data(); }); snap.docChanges().forEach(c=>{ if(c.type==='removed') delete status[c.doc.id]; }); renderPlan(); }, ()=>{});
  })();

  const nav = document.getElementById('docnav'), art = document.getElementById('doc');
  const renderer = new marked.Renderer();
  renderer.code = function(code, lang){ const c = typeof code==='object' ? code.text : code; const l = typeof code==='object' ? code.lang : lang; if(l==='mermaid') return '<pre class="mermaid">'+c.replace(/</g,'&lt;')+'</pre>'; return '<pre><code>'+c.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</code></pre>'; };
  renderer.table = function(header, body){ if(typeof header==='object'){ const t=header; const h='<tr>'+t.header.map(c=>'<th>'+marked.parseInline(c.text)+'</th>').join('')+'</tr>'; const b=t.rows.map(r=>'<tr>'+r.map(c=>'<td>'+marked.parseInline(c.text)+'</td>').join('')+'</tr>').join(''); return '<div class="tbl"><table><thead>'+h+'</thead><tbody>'+b+'</tbody></table></div>'; } return '<div class="tbl"><table><thead>'+header+'</thead><tbody>'+body+'</tbody></table></div>'; };
  function showDoc(i){ nav.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-selected', i===j)); art.innerHTML = marked.parse(docs[i].md, {renderer, gfm:true}); art.querySelectorAll('a[href^="docs/"],a[href^="../"],a[href$=".md"]').forEach(a=>{ const n=a.getAttribute('href').split('/').pop().replace('.md',''); const k=docs.findIndex(d=>d.name===n); if(k>=0){ a.href='#'; a.onclick=e=>{e.preventDefault(); showDoc(k); window.scrollTo({top:0});}; } }); if(window.mermaid){ try{ mermaid.run({nodes: art.querySelectorAll('pre.mermaid')}); }catch(e){} } }
  docs.forEach((d,i)=>{ const b=document.createElement('button'); b.textContent=d.name; b.setAttribute('aria-selected', i===0); b.onclick=()=>showDoc(i); nav.appendChild(b); });
  showDoc(0);

  document.getElementById('mock').innerHTML = [
    ['Direction variants', 'Six directions (Workshop, Screening room, Notebook, Blueprint, Journal, Playground), six screens each, eight live motion candidates. Chosen: C · Notebook (2026-09-17).', L.variants, 'Open variants'],
    ['Screens · v1', 'Every v1 screen in Notebook: home, browse, course, player (resume), buy sheet, my learning, certificate + verify, sign in / apply, creator page, studio (courses, editor, lesson upload → processing → ready, failed, earnings), admin (dashboard, creators, courses + jobs), states.', L.screens, 'Open screens'],
    ['Landing · live', 'The existing landing page, deployed on Vercel from web/ (will move to skillroom.virajdomadia.com).', L.landing, 'Open landing'],
    ['Photos', 'CC photos from Wikimedia Commons in mockups/img/ with credits in CREDITS.md — Skillroom and its creators are fictional.', L.repo + '/blob/main/mockups/img/CREDITS.md', 'Credits'],
  ].map(([t,p,u,b])=>`<div class="card"><div class="k">mockup</div><h3>${t}</h3><p>${p}</p><a class="btnl" href="${u}" target="_blank" rel="noopener">${b} ↗</a></div>`).join('');

  document.getElementById('proj').innerHTML = [
    ['Name', '<b>Skillroom</b> · learn from people who do it · project 5 of 6, build fourth'],
    ['One-liner', 'A three-sided course platform (student / creator / admin) on our own video stack: upload → ffmpeg worker → encrypted adaptive HLS → a key server that only answers for enrolled students. No Mux, ₹0 per play.'],
    ['URLs', 'skillroom.virajdomadia.com · api.skillroom.virajdomadia.com · landing at skillroom-viraj.vercel.app until DNS'],
    ['Repo', `<a href="${L.repo}" target="_blank" rel="noopener">github.com/virajdomadia/skillroom</a> · web/ Next.js 15 + hls.js · api/ FastAPI + fpdf2 · worker/ ffmpeg on GitHub Actions`],
    ['Versions', '<b>v1 Classroom</b> 16 h → <b>v2 All-access</b> 11 h → <b>v3 Royalties</b> 8 h → <b>v4 Offline lessons</b> 3 h ≈ 38 h · add-ons after v4 only from time saved'],
    ['Unique feature', 'v4: the site installs as a PWA; a lesson downloads as encrypted segments and plays offline under a 48-h key lease — ₹0 per use, and "non-enrolled can never play" still holds'],
    ['Engine', 'Client upload to Blob → video_jobs → repository_dispatch → worker (ffmpeg: 240/480/720p, AES-128, poster, sprite) → Blob → manifest; API generates playlists and serves the key only after can_watch()'],
    ['Money', 'Razorpay one-off (v1) with idempotent mark_paid → enrollment + ledger (80/20); Subscriptions state machine (v2); pool split by subscriber-minutes (v3); payouts marked by admin'],
    ['Seed', '6 fictional Bengaluru creators · 6 courses · 24 lessons of real CC video from Commons through the real worker · ≤ 700 MB · ~40 enrollments with heartbeats; demo student, creator, admin'],
    ['Direction', 'C · Notebook — ruled paper with a red margin, Fraunces + Onest + Caveat, taped photos, sticky-note prices, contents with dotted leaders, stamps for state; signature = Develop + Stamp in the studio, Resume glide (sticky note) in the player'],
    ['Lifecycle', 'Steps 1–7 complete (2026-09-17). Next: step 8 = milestone 1.0, after Offcut (order 1 → 2 → 4 → 5 → 3 → 6)'],
    ['Rules', 'Lean setup, rich features · accounts just-in-time (Neon S2; Blob + GitHub dispatch token + Actions secrets S3; Razorpay F3; Resend L4) · one PR per row, every PR visible in the browser · tests only from 04 §13 · tracker updated per milestone'],
  ].map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('');

  const tabs=[...document.querySelectorAll('.tab')];
  function show(p){ tabs.forEach(t=>t.setAttribute('aria-selected', t.dataset.p===p)); document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on', x.id==='p-'+p)); try{localStorage.setItem('sr-tab',p)}catch(e){} }
  tabs.forEach(t=>t.onclick=()=>show(t.dataset.p));
  let start='plan'; try{ start=localStorage.getItem('sr-tab')||'plan'; }catch(e){} show(start);
})();
</script>
